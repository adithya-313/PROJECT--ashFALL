# File: .github/workflows/ci.yml
# Purpose: Intentionally minimal CI pipeline for Level 0.
# Right now it only checks that the full Docker Compose stack boots cleanly.
# Each subsequent level (1, 2, 3, ...) will add its own step (unit tests,
# contract tests, benchmark gates, etc.) to this file.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compose-boot:
    name: Docker Compose boot check
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # CI has no .env file, so we create one from the example template.
      # This gives docker compose the required variables (DATABASE_URL, REDIS_URL, etc.)
      # without storing any secrets in the repo.
      - name: Create .env from example
        run: cp .env.example .env

      # The real file is gitignored because it holds the key, so CI uses the example's dummy key.
      - name: Create nationalsim.env from example
        run: cp envs/nationalsim.env.example envs/nationalsim.env

      # Python 3.11 and the same requirements-dev.txt as every other job, so lint and types see the same versions.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
            requirements-showcase.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # ruff checks for style errors, unused imports, and formatting issues.
      - name: Lint (ruff)
        run: ruff check api/ core/ nationalsim/

      # mypy checks for type mismatches without running the code.
      - name: Type check (mypy)
        run: mypy api/ core/ nationalsim/ --ignore-missing-imports --no-strict-optional

      # Log in to Docker Hub so image pulls are not limited as anonymous requests (the rate limit that failed the
      # boot check). The step is skipped when the secrets are absent, for example on pull requests from forks.
      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      # Boot every service defined in docker-compose.yml and wait for all
      # healthchecks to pass (--wait). If any service fails to become healthy,
      # this step exits non-zero and the job fails.
      # The "gpu" profile (Triton) is excluded here — it pulls a ~10 GB image
      # and needs a GPU runner. Run it locally: docker compose --profile gpu up
      - name: Boot all services
        run: docker compose up --wait

      # Hit /health and assert it returns HTTP 200.
      # curl -o /dev/null discards the body; -s silences progress output.
      # -w "%{http_code}" prints only the status code so we can compare it.
      - name: "Smoke test: /health returns 200"
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health)
          if [ "$STATUS" != "200" ]; then
            echo "Expected 200 but got $STATUS"
            exit 1
          fi
          echo "Smoke test passed: /health returned 200"

      # Fetch the /health response body, then validate it against the pinned JSON Schema.
      # jsonschema is a standard Python library for JSON Schema validation.
      - name: "Contract test: /health response schema"
        run: |
          pip install jsonschema --quiet
          curl -s http://localhost:8000/health -o /tmp/health_response.json
          python - <<'EOF'
          import json, jsonschema, sys
          # Load the response body and the pinned schema
          with open("/tmp/health_response.json") as f:
              body = json.load(f)
          with open("tests/contract/health_response.schema.json") as f:
              schema = json.load(f)
          try:
              jsonschema.validate(instance=body, schema=schema)
              print("Contract test passed: response matches schema")
          except jsonschema.ValidationError as e:
              print(f"Contract test FAILED: {e.message}")
              sys.exit(1)
          EOF

      # Always tear down cleanly so the runner doesn't leave orphan containers.
      - name: Tear down services
        if: always()
        run: docker compose down

  # Validates the Pandera schema in data/schemas/enriched_transactions.py
  # against synthetic in-memory data. Runs independently of compose-boot —
  # no Docker, no services, no parquet file on disk required.
  schema-validation:
    name: Pandera schema gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install schema dependencies
        run: pip install "pandas==2.3.3" "pandera==0.22.1" pyarrow pyyaml

      - name: Run schema gate
        run: python tests/schema/test_enriched_schema.py

  # Sub-phase 5.11: model-quality gate. CI has no data, GPU or MLflow store, so it cannot re-score the model.
  # It reads the committed reports/model/metrics.json and reports/calibration/calibration_bins.json instead and
  # fails the build if PR-AUC is below MODEL_AUC_THRESHOLD or any calibration bin is off by more than 10 points.
  # Runs independently of the other jobs. Standard library only, so there is nothing to pip install.
  model-quality-gate:
    name: Model quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Same pattern as compose-boot: the threshold lives in .env.example, CI copies it to .env.
      - name: Create .env from example
        run: cp .env.example .env

      # The real file is gitignored because it holds the key, so CI uses the example's dummy key.
      - name: Create nationalsim.env from example
        run: cp envs/nationalsim.env.example envs/nationalsim.env

      - name: Run quality gate on the committed metrics
        run: python scripts/ci_quality_gate.py

      # Proof the gate really blocks a bad model: feed it a fixture with PR-AUC 0.5 and require that it fails
      # with exit code 1 AND the PR-AUC failure message (so a crash or typo cannot pass this step by accident).
      - name: "Proof: gate rejects a degraded model"
        run: |
          code=0
          output=$(python scripts/ci_quality_gate.py --metrics tests/fixtures/metrics_degraded.json 2>&1) || code=$?
          echo "$output"
          if [ "$code" = "1" ] && echo "$output" | grep -q "FAIL PR-AUC"; then
            echo "Gate correctly failed the degraded model"
          else
            echo "Expected the gate to fail on PR-AUC (exit 1), got exit $code"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Job: level-showcase
  # What: checks the Level 7 code (lint, types, tests) with the SAME pinned versions as requirements.txt on
  #       Python 3.11, then runs the Level 7 showcase against a real Postgres and a real Redpanda.
  # Why:  the outbox promises (atomic write, ordered delivery, nothing lost when the broker stops) can only be
  #       proven against the real services, and the pinned versions are what the Docker image uses.
  # ---------------------------------------------------------------------------
  level-showcase:
    runs-on: ubuntu-latest
    # Stop the job if it hangs, so a stuck service cannot block CI for hours.
    timeout-minutes: 30
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    # Least privilege: this job only needs to read the code, nothing else.
    permissions:
      contents: read
    steps:
      # Download the code of the commit being tested.
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # The Level 10 pre-registration check compares commit dates, so it needs the full git history.
          fetch-depth: 0

      # Use Python 3.11, the version the Docker image and the lint settings target. The pip cache makes repeat runs
      # faster and is keyed on requirements.txt.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
            requirements-showcase.txt
            requirements-dev.txt

      # The app configuration reads DATABASE_URL and other settings from .env, so create it from the example.
      - name: Create .env from example
        run: cp .env.example .env

      # The real file is gitignored because it holds the key, so CI uses the example's dummy key.
      - name: Create nationalsim.env from example
        run: cp envs/nationalsim.env.example envs/nationalsim.env

      # Install exactly the pinned packages from the ONE dev file. It includes requirements.txt (the pinned app, ruff,
      # mypy, pytest and anyio), requirements-test.txt and requirements-showcase.txt (dvc and the test packages,
      # kept out of requirements.txt because that feeds the Docker image), and the type stubs.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Style check on the Level 7 code and the code it uses.
      - name: Lint (ruff)
        run: ruff check showcase api core evaluation nationalsim

      # Type check on the same folders.
      - name: Type check (mypy)
        run: mypy showcase api core evaluation nationalsim --ignore-missing-imports --no-strict-optional

      # Fast unit tests that need no database or Kafka. Two kinds of old problems are left out on purpose and are
      # NOT fixed in Level 7 (known issues, tracked in the pull request):
      #   - test_velocity_features.py needs the package fakeredis, which is not in requirements.txt.
      #   - Two geo tests fail on numpy 2.x because numpy is not pinned in requirements.txt (numpy 2.x prints
      #     floats as np.float64(...), which the old code cannot parse).
      # FAIL_ON_SKIP=1 makes the run fail if any test is skipped (see tests/fail_on_skip.py). Tests that cannot run
      # here are left out on purpose by marker: gpu (needs a GPU), ml (runs in the ml-tests job) and needs_dvc
      # (needs files from `dvc pull`, local only).
      - name: Unit tests
        env:
          FAIL_ON_SKIP: "1"
        run: >-
          pytest tests/unit -q -rs -p no:cacheprovider -m "not gpu and not ml and not needs_dvc"
          --ignore=tests/unit/test_velocity_features.py
          --deselect tests/unit/test_geo_velocity.py::test_vectorized_batch_equals_old_loop_on_many_random_rows
          --deselect tests/unit/test_geo_velocity.py::test_array_haversine_matches_single_pair_haversine_bit_for_bit

      # Start only the two services the next steps need, and wait until their health checks pass.
      # Log in to Docker Hub so image pulls are not limited as anonymous requests (the rate limit that failed the
      # boot check). The step is skipped when the secrets are absent, for example on pull requests from forks.
      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Start Postgres and Redpanda
        run: docker compose up --wait postgres redpanda

      # CI's database starts empty. The isolation test needs the real tables in the public schema, to prove that
      # the showcase never changes them. The migration runner can be run again safely (it skips files it already
      # applied), so running it here is harmless. DATABASE_URL comes from .env, but the Docker host name "postgres"
      # does not exist on the runner itself, so it is replaced by "localhost" for this one command only. The URL
      # is never printed.
      - name: Apply database migrations
        run: |
          DATABASE_URL=$(grep '^DATABASE_URL=' .env | cut -d= -f2- | sed 's/@postgres:/@localhost:/')             python scripts/run_migrations.py

      # Integration tests against the real services. A SKIPPED test here means a service was unreachable. In CI that
      # must fail, never pass quietly. The pytest exit code is captured explicitly so that piping through tee can
      # never hide a failure.
      - name: Integration tests (fail on any skip)
        shell: bash
        run: |
          set +e
          python -m pytest \
            tests/integration/test_atomic_writer.py \
            tests/integration/test_migration_runner.py \
            tests/integration/test_showcase_isolation.py \
            tests/integration/test_showcase_kafka_tools.py \
            tests/contract/test_orjson_in_response.py \
            tests/integration/test_pool_initialization.py \
            tests/integration/test_upi_schema_0006.py \
            tests/integration/test_bank_isolation.py \
            tests/integration/test_upi_outbox_writer.py \
            tests/integration/test_bank_api_tables_0007.py \
            tests/integration/test_bank_request_auth.py \
            tests/integration/test_bank_idempotency.py \
            tests/integration/test_bank_endpoints.py \
            tests/contract/test_bank_api_fuzz.py \
            -q -rs -p no:cacheprovider 2>&1 | tee "$RUNNER_TEMP/integration.log"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "pytest failed with exit code $code"
            exit "$code"
          fi
          if grep -q "SKIPPED" "$RUNNER_TEMP/integration.log"; then
            echo "A test was skipped: a service was not reachable, which counts as a failure in CI."
            exit 1
          fi

      # Dry-run make show with LEVEL=12 and PART=a to verify the Makefile passes --part through to the showcase CLI.
      # Runs on the Linux CI runner where make is installed, ensuring part-filtered showcase runs work as intended.
      - name: Check make passes PART through
        run: make -n show LEVEL=12 PART=a | tee "$RUNNER_TEMP/make_dry_run.txt" && grep -q -- "--part a" "$RUNNER_TEMP/make_dry_run.txt"

      # Run every level showcase in quick mode (the Level 7 checks, including stopping the broker twice).
      - name: Run the showcase
        run: make show-all QUICK=1
        timeout-minutes: 10

      # "--all" exits with 0 when it finds no levels at all, so check that the Level 7 result file exists. That
      # proves the Level 7 showcase really ran.
      - name: Check the Level 7 report exists
        run: test -f reports/showcase/level_07/result.json

      # Keep the HTML and JSON reports so they can be downloaded from the run page, even when an earlier step failed.
      - name: Upload showcase reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-reports
          path: reports/showcase/
          retention-days: 14
          if-no-files-found: warn

      # Only on failure: show what the services were doing, to help find the cause.
      - name: Show service status and logs
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail 80 redpanda postgres

      # Always stop the services at the end, even when something failed.
      - name: Stop services
        if: always()
        run: docker compose down

  # ---------------------------------------------------------------------------
  # Job: pytest-fast
  # What: runs the fast tests that need no Docker, no database and no Kafka: the unit, contract, property and schema
  #       tests, plus the regression baselines (tests/baselines).
  # Why:  these tests give a quick answer on every push and pull request. Tests that need the running stack are marked
  #       needs_stack and are covered by the other jobs.
  # ---------------------------------------------------------------------------
  pytest-fast:
    name: Fast tests (no Docker)
    runs-on: ubuntu-latest
    # Stop the job if it hangs.
    timeout-minutes: 15
    # Least privilege: this job only needs to read the code.
    permissions:
      contents: read
    steps:
      # Download the code of the commit being tested.
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # The Level 10 pre-registration check compares commit dates, so it needs the full git history.
          fetch-depth: 0

      # Use Python 3.11, the version the Docker image targets.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
            requirements-showcase.txt
            requirements-dev.txt

      # The app configuration reads its settings from .env, so create it from the example. No service is started.
      - name: Create .env from example
        run: cp .env.example .env

      # The real file is gitignored because it holds the key, so CI uses the example's dummy key.
      - name: Create nationalsim.env from example
        run: cp envs/nationalsim.env.example envs/nationalsim.env

      # The same ONE dev file as the other jobs (pinned app packages, test-only packages and type stubs).
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Fails if core/ or showcase/ imports a package that requirements-dev.txt (and the files it includes) lacks.
      - name: Check that every import is declared
        run: python -m core.imports_check

      # Fails if hidden truth is imported outside allowed folders or truth env vars leak into operational code.
      - name: Check hidden truth isolation
        run: python -m core.truth_import_check

      # Fails if a top-level folder is not listed in config/folder_classification.yaml, or an engine folder is not
      # listed in config/new_engine_paths.yaml.
      - name: Check the top-level folder classification
        run: python -m core.folder_check

      # Fails if config/issues_v2.yaml is not valid: an ID missing or invented, a built issue whose evidence cannot be
      # found, or a config issue_ids_v2 tag that names an unknown ID or has no derived_from.
      - name: Check the version 2 issue register
        run: python -m core.issue_register_v2

      # Run the fast folders. "-m not needs_stack" skips tests that need the Docker stack. The geo-velocity tests and
      # test_velocity_features.py (which the level-showcase job leaves out) DO run here: the geo tests now use a small
      # relative tolerance instead of exact bits, and requirements-test.txt installs fakeredis.
      # FAIL_ON_SKIP=1: any skipped test fails the job. gpu, ml and needs_dvc tests are deselected by marker instead.
      - name: Fast tests
        env:
          FAIL_ON_SKIP: "1"
        run: >-
          pytest -q -rs -p no:cacheprovider -m "not needs_stack and not gpu and not ml and not needs_dvc"
          tests/unit tests/contract tests/property tests/schema tests/baselines

  # ---------------------------------------------------------------------------
  # Job: ml-tests
  # What: installs the machine-learning libraries (requirements-ml.txt) and runs the tests marked "ml", which the
  #       other jobs leave out because those libraries are not installed there.
  # Why:  these tests check the Level 5 training scripts and the Level 9 audit. FAIL_ON_SKIP=1 makes any skip fail.
  # ---------------------------------------------------------------------------
  ml-tests:
    name: ML tests (requirements-ml.txt)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      FAIL_ON_SKIP: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ml.txt

      # The scripts read their settings from .env, so create it from the example.
      - name: Create .env from example
        run: cp .env.example .env

      # The real file is gitignored because it holds the key, so CI uses the example's dummy key.
      - name: Create nationalsim.env from example
        run: cp envs/nationalsim.env.example envs/nationalsim.env

      # requirements-ml.txt installs in one go (numpy stays 1.26.4 for the frozen model v1; shap is pinned to 0.49.1).
      # pytest, PyYAML and orjson use the same versions as requirements.txt and requirements-test.txt.
      - name: Install the machine-learning libraries
        run: pip install -r requirements-ml.txt pytest==8.3.5 PyYAML==6.0.3 orjson==3.10.18

      # Only the test files that use the ml marker (the other test files need packages that are not installed here).
      # needs_dvc tests are left out: they need files from `dvc pull`.
      - name: Run the ml tests
        run: pytest $(grep -rl "pytest.mark.ml" tests/unit) -q -rs -p no:cacheprovider -m "ml and not needs_dvc"
