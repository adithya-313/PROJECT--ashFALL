# File: .github/workflows/ci.yml
# Purpose: Intentionally minimal CI pipeline for Level 0.
# Right now it only checks that the full Docker Compose stack boots cleanly.
# Each subsequent level (1, 2, 3, ...) will add its own step (unit tests,
# contract tests, benchmark gates, etc.) to this file.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compose-boot:
    name: Docker Compose boot check
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # CI has no .env file, so we create one from the example template.
      # This gives docker compose the required variables (DATABASE_URL, REDIS_URL, etc.)
      # without storing any secrets in the repo.
      - name: Create .env from example
        run: cp .env.example .env

      # Install only the lint and type-check tools — not the full requirements —
      # so this step is fast and fails early before we wait for Docker.
      - name: Install dependencies
        run: pip install ruff mypy

      # ruff checks for style errors, unused imports, and formatting issues.
      - name: Lint (ruff)
        run: ruff check api/ core/

      # mypy checks for type mismatches without running the code.
      - name: Type check (mypy)
        run: mypy api/ core/ --ignore-missing-imports --no-strict-optional

      # Boot every service defined in docker-compose.yml and wait for all
      # healthchecks to pass (--wait). If any service fails to become healthy,
      # this step exits non-zero and the job fails.
      # The "gpu" profile (Triton) is excluded here — it pulls a ~10 GB image
      # and needs a GPU runner. Run it locally: docker compose --profile gpu up
      - name: Boot all services
        run: docker compose up --wait

      # Hit /health and assert it returns HTTP 200.
      # curl -o /dev/null discards the body; -s silences progress output.
      # -w "%{http_code}" prints only the status code so we can compare it.
      - name: "Smoke test: /health returns 200"
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health)
          if [ "$STATUS" != "200" ]; then
            echo "Expected 200 but got $STATUS"
            exit 1
          fi
          echo "Smoke test passed: /health returned 200"

      # Fetch the /health response body, then validate it against the pinned JSON Schema.
      # jsonschema is a standard Python library for JSON Schema validation.
      - name: "Contract test: /health response schema"
        run: |
          pip install jsonschema --quiet
          curl -s http://localhost:8000/health -o /tmp/health_response.json
          python - <<'EOF'
          import json, jsonschema, sys
          # Load the response body and the pinned schema
          with open("/tmp/health_response.json") as f:
              body = json.load(f)
          with open("tests/contract/health_response.schema.json") as f:
              schema = json.load(f)
          try:
              jsonschema.validate(instance=body, schema=schema)
              print("Contract test passed: response matches schema")
          except jsonschema.ValidationError as e:
              print(f"Contract test FAILED: {e.message}")
              sys.exit(1)
          EOF

      # Always tear down cleanly so the runner doesn't leave orphan containers.
      - name: Tear down services
        if: always()
        run: docker compose down

  # Validates the Pandera schema in data/schemas/enriched_transactions.py
  # against synthetic in-memory data. Runs independently of compose-boot —
  # no Docker, no services, no parquet file on disk required.
  schema-validation:
    name: Pandera schema gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install schema dependencies
        run: pip install "pandas==2.3.3" "pandera==0.22.1" pyarrow pyyaml

      - name: Run schema gate
        run: python tests/schema/test_enriched_schema.py
