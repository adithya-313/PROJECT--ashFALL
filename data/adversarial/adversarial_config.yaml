# data/adversarial/adversarial_config.yaml
# Purpose: Fixed random seed for adversarial pattern injection.
# The same seed must reproduce identical injection on every run.
# Changing this seed invalidates the DVC hash — update REPRODUCIBILITY.md if you do.

adversarial_injection:
  seed: 42
  noise_probability: 0.50  # Raised from 0.30 — previous value produced AUC > 0.70 on both testable patterns, indicating signals were too separable. Raised to pass the AUC <= 0.70 quality gate.
