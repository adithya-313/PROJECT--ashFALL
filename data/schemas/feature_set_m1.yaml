# Schema specification for M1 live mule features.
# Level 15b Round 2b-1: Canonical M1 feature list from architecture plan.

features:
  # -----------------------------------------------------------------------------
  # Group: inflow
  # -----------------------------------------------------------------------------
  - name: "distinct_payers_1h"
    group: "inflow"
    definition: "Count of distinct sending counterparties on successful credit transactions in the last 1 hour sliding window."
    bank_visible_source_records: "PaymentSideRecord (side='credit', status='success')"
    window_or_horizon: "1h (3600s)"
    empty_means: "zero"
    issue_ids: ["G1"]

  - name: "distinct_payers_24h"
    group: "inflow"
    definition: "Count of distinct sending counterparties on successful credit transactions in the last 24 hours sliding window."
    bank_visible_source_records: "PaymentSideRecord (side='credit', status='success')"
    window_or_horizon: "24h (86400s)"
    empty_means: "zero"
    issue_ids: ["G1"]

  - name: "distinct_payers_7d"
    group: "inflow"
    definition: "Count of distinct sending counterparties on successful credit transactions in the last 7 days sliding window."
    bank_visible_source_records: "PaymentSideRecord (side='credit', status='success')"
    window_or_horizon: "7d (604800s)"
    empty_means: "zero"
    issue_ids: ["G1"]

  - name: "first_time_payer_share_24h"
    group: "inflow"
    definition: "Share of 24h credit payers never seen paying this account before the 24h window (closed counterparty days + earlier raw records)."
    bank_visible_source_records: "PaymentSideRecord (side='credit', status='success'), account_summaries counterparty days"
    window_or_horizon: "24h (86400s)"
    empty_means: "no data"
    issue_ids: ["G1"]

  - name: "small_credit_count_24h"
    group: "inflow"
    definition: "Count of successful credit transactions with amount <= small_credit_max_paise in the last 24 hours."
    bank_visible_source_records: "PaymentSideRecord (side='credit', status='success')"
    window_or_horizon: "24h (86400s)"
    empty_means: "zero"
    issue_ids: ["G1"]

  - name: "small_credit_count_7d"
    group: "inflow"
    definition: "Count of successful credit transactions with amount <= small_credit_max_paise in the last 7 days."
    bank_visible_source_records: "PaymentSideRecord (side='credit', status='success')"
    window_or_horizon: "7d (604800s)"
    empty_means: "zero"
    issue_ids: ["G1"]

  - name: "below_threshold_credit_count_7d"
    group: "inflow"
    definition: "Count of successful credit transactions within below_threshold_band_fraction below any amount in reporting_thresholds_paise in the last 7 days."
    bank_visible_source_records: "PaymentSideRecord (side='credit', status='success')"
    window_or_horizon: "7d (604800s)"
    empty_means: "zero"
    issue_ids: ["G1"]

  # -----------------------------------------------------------------------------
  # Group: outflow
  # -----------------------------------------------------------------------------
  - name: "pass_through_ratio_24h"
    group: "outflow"
    definition: "Ratio of (successful debits + successful withdrawals) amount to successful credits amount in the last 24 hours."
    bank_visible_source_records: "PaymentSideRecord, WithdrawalRecord"
    window_or_horizon: "24h (86400s)"
    empty_means: "no data"
    issue_ids: ["G1", "G2"]

  - name: "pass_through_ratio_7d"
    group: "outflow"
    definition: "Ratio of (successful debits + successful withdrawals) amount to successful credits amount in the last 7 days."
    bank_visible_source_records: "PaymentSideRecord, WithdrawalRecord"
    window_or_horizon: "7d (604800s)"
    empty_means: "no data"
    issue_ids: ["G1", "G2"]

  - name: "median_credit_to_debit_seconds_7d"
    group: "outflow"
    definition: "For each successful debit or withdrawal in the last 7 days, seconds since the latest earlier successful credit; median across all pairs."
    bank_visible_source_records: "PaymentSideRecord, WithdrawalRecord"
    window_or_horizon: "7d (604800s)"
    empty_means: "no data"
    issue_ids: ["G1", "G2"]

  - name: "top_receiver_share_7d"
    group: "outflow"
    definition: "Share of successful debit amount going to the single largest receiving counterparty in the last 7 days."
    bank_visible_source_records: "PaymentSideRecord (side='debit', status='success')"
    window_or_horizon: "7d (604800s)"
    empty_means: "no data"
    issue_ids: ["G1"]

  - name: "other_bank_outflow_share_7d"
    group: "outflow"
    definition: "Share of successful debit amount whose counterparty_bank_id differs from this bank in the last 7 days."
    bank_visible_source_records: "PaymentSideRecord (side='debit', status='success')"
    window_or_horizon: "7d (604800s)"
    empty_means: "no data"
    issue_ids: ["G1", "R8"]

  - name: "outflow_to_person_paise_7d"
    group: "outflow"
    definition: "Total outgoing amount in paise sent to person counterparties across successful debits in the last 7 days."
    bank_visible_source_records: "PaymentSideRecord (side='debit', status='success', payee_type='person')"
    window_or_horizon: "7d (604800s)"
    empty_means: "zero"
    issue_ids: ["G2"]

  - name: "outflow_to_merchant_paise_7d"
    group: "outflow"
    definition: "Total outgoing amount in paise sent to merchant counterparties across successful debits in the last 7 days."
    bank_visible_source_records: "PaymentSideRecord (side='debit', status='success', payee_type='merchant')"
    window_or_horizon: "7d (604800s)"
    empty_means: "zero"
    issue_ids: ["G2"]

  - name: "cash_atm_paise_7d"
    group: "outflow"
    definition: "Total cash amount in paise withdrawn across successful ATM withdrawals in the last 7 days."
    bank_visible_source_records: "WithdrawalRecord (channel='atm', status='success')"
    window_or_horizon: "7d (604800s)"
    empty_means: "zero"
    issue_ids: ["G2"]

  - name: "cash_branch_paise_7d"
    group: "outflow"
    definition: "Total cash amount in paise withdrawn across successful branch withdrawals in the last 7 days."
    bank_visible_source_records: "WithdrawalRecord (channel='branch', status='success')"
    window_or_horizon: "7d (604800s)"
    empty_means: "zero"
    issue_ids: ["G2"]

  # -----------------------------------------------------------------------------
  # Group: balance_pattern
  # -----------------------------------------------------------------------------
  - name: "current_balance_paise"
    group: "balance_pattern"
    definition: "Ledger balance in paise immediately following the latest transaction or withdrawal record that carries a balance."
    bank_visible_source_records: "PaymentSideRecord, WithdrawalRecord"
    window_or_horizon: "latest"
    empty_means: "no data"
    issue_ids: ["G2"]

  - name: "min_balance_paise_7d"
    group: "balance_pattern"
    definition: "Lowest ledger balance in paise observed across all records carrying a balance in the last 7 days."
    bank_visible_source_records: "PaymentSideRecord, WithdrawalRecord"
    window_or_horizon: "7d (604800s)"
    empty_means: "no data"
    issue_ids: ["G2"]

  - name: "near_zero_cycles_7d"
    group: "balance_pattern"
    definition: "Count of times a successful credit was followed, before the next credit, by a balance <= near_zero_balance_max_paise in the last 7 days."
    bank_visible_source_records: "PaymentSideRecord, WithdrawalRecord"
    window_or_horizon: "7d (604800s)"
    empty_means: "no data"
    issue_ids: ["G2"]

  # -----------------------------------------------------------------------------
  # Group: routine_life
  # -----------------------------------------------------------------------------
  - name: "salary_like_payer_count"
    group: "routine_life"
    definition: "Count of distinct counterparty sources providing periodic monthly salary deposits across closed days over the summary horizon."
    bank_visible_source_records: "features/account_summaries.py counterparty days"
    window_or_horizon: "summary_horizon_days (62d)"
    empty_means: "not enough history"
    issue_ids: ["G1"]

  - name: "recurring_merchant_payee_count"
    group: "routine_life"
    definition: "Count of distinct merchant counterparties with repeated payments across closed days over the summary horizon."
    bank_visible_source_records: "features/account_summaries.py counterparty days"
    window_or_horizon: "summary_horizon_days (62d)"
    empty_means: "not enough history"
    issue_ids: ["G1"]

  - name: "regular_transfer_payee_count"
    group: "routine_life"
    definition: "Count of distinct personal counterparties with regular recurring transfers across closed days over the summary horizon."
    bank_visible_source_records: "features/account_summaries.py counterparty days"
    window_or_horizon: "summary_horizon_days (62d)"
    empty_means: "not enough history"
    issue_ids: ["G1"]

  - name: "routine_life_present"
    group: "routine_life"
    definition: "Composite indicator evaluating presence of established routine life patterns (salary, recurring merchants, or regular transfers)."
    bank_visible_source_records: "features/account_summaries.py day totals and counterparty days"
    window_or_horizon: "summary_horizon_days (62d)"
    empty_means: "not enough history"
    issue_ids: ["G1"]

  - name: "history_days_available"
    group: "routine_life"
    definition: "Whole calendar days since the earliest closed active day observed by this bank, capped at summary_horizon_days."
    bank_visible_source_records: "features/account_summaries.py active_days ZSET"
    window_or_horizon: "summary_horizon_days (62d)"
    empty_means: "zero"
    issue_ids: ["G1"]

  # -----------------------------------------------------------------------------
  # Group: lifecycle
  # -----------------------------------------------------------------------------
  - name: "account_age_days"
    group: "lifecycle"
    definition: "Elapsed calendar days since genuine account opening date as established by the account_opened event."
    bank_visible_source_records: "features/account_summaries.py opened_at ZSET"
    window_or_horizon: "account lifetime"
    empty_means: "no data"
    issue_ids: ["G1"]

  - name: "account_type"
    group: "lifecycle"
    definition: "Customer account classification type (e.g. savings, current) recorded at account opening."
    bank_visible_source_records: "AccountEventRecord (kind='account_opened' details)"
    window_or_horizon: "account lifetime"
    empty_means: "no data"
    issue_ids: ["R8"]

  - name: "dormancy_days_before_recent_activity"
    group: "lifecycle"
    definition: "Number of consecutive dormant days between preceding active history and the onset of recent activity."
    bank_visible_source_records: "features/account_summaries.py active_days ZSET"
    window_or_horizon: "summary_horizon_days (62d)"
    empty_means: "no data"
    issue_ids: ["G1"]

  - name: "volume_vs_own_history_ratio"
    group: "lifecycle"
    definition: "Ratio of recent 7d transaction volume to the account's own historical average daily volume over the summary horizon."
    bank_visible_source_records: "features/account_summaries.py day totals, PaymentSideRecord"
    window_or_horizon: "summary_horizon_days (62d)"
    empty_means: "not enough history"
    issue_ids: ["G1"]

  # -----------------------------------------------------------------------------
  # Group: control
  # -----------------------------------------------------------------------------
  - name: "days_since_device_change"
    group: "control"
    definition: "Elapsed calendar days since the most recent device binding change or SIM swap event on the account."
    bank_visible_source_records: "AccountEventRecord (kind in ['device_binding_change', 'sim_swap'])"
    window_or_horizon: "account lifetime"
    empty_means: "no data"
    issue_ids: ["R5"]

  - name: "accounts_on_same_device"
    group: "control"
    definition: "Count of distinct customer accounts observed transacting on the same mobile device fingerprint within this bank."
    bank_visible_source_records: "PaymentSideRecord.sender_device_fingerprint"
    window_or_horizon: "7d (604800s)"
    empty_means: "zero"
    issue_ids: ["R5"]

  - name: "device_hardware_changed"
    group: "control"
    definition: "Binary flag indicating whether a physical mobile hardware device binding change occurred within 7 days."
    bank_visible_source_records: "AccountEventRecord (kind='device_binding_change')"
    window_or_horizon: "7d (604800s)"
    empty_means: "zero"
    issue_ids: ["R5"]

  - name: "sim_swapped"
    group: "control"
    definition: "Binary flag indicating whether a mobile SIM card swap event occurred on the customer phone number within 7 days."
    bank_visible_source_records: "AccountEventRecord (kind='sim_swap')"
    window_or_horizon: "7d (604800s)"
    empty_means: "zero"
    issue_ids: ["R5"]

  - name: "app_reinstalled_same_phone"
    group: "control"
    definition: "Binary flag indicating whether the banking application was reinstalled on the same physical phone hardware within 7 days."
    bank_visible_source_records: "AccountEventRecord (kind='app_reinstall')"
    window_or_horizon: "7d (604800s)"
    empty_means: "zero"
    issue_ids: ["R5"]

  - name: "new_device_r5"
    group: "control"
    definition: "Architect R5 composite indicator: 1 if physical hardware changed, SIM swapped, or fresh app on different phone within 7 days; 0 on OS updates."
    bank_visible_source_records: "AccountEventRecord, PaymentSideRecord"
    window_or_horizon: "7d (604800s)"
    empty_means: "zero"
    issue_ids: ["R5"]

  - name: "distinct_fingerprints_lifetime"
    group: "control"
    definition: "Count of distinct mobile device fingerprints observed transacting on this account over its entire lifetime."
    bank_visible_source_records: "features/account_summaries.py fingerprints ZSET"
    window_or_horizon: "account lifetime"
    empty_means: "zero"
    issue_ids: ["R5"]

  - name: "machine_regular_timing_score"
    group: "control"
    definition: "Statistical metric measuring machine-like regularity in inter-transaction arrival time intervals."
    bank_visible_source_records: "PaymentSideRecord"
    window_or_horizon: "7d (604800s)"
    empty_means: "no data"
    issue_ids: ["R5"]

  # -----------------------------------------------------------------------------
  # Group: region
  # -----------------------------------------------------------------------------
  - name: "distinct_same_bank_payer_regions_7d"
    group: "region"
    definition: "Count of distinct home regions observed across same-bank payers sending credits to this account in the last 7 days."
    bank_visible_source_records: "PaymentSideRecord, AccountEventRecord (account_opened details.home_region)"
    window_or_horizon: "7d (604800s)"
    empty_means: "zero"
    issue_ids: ["E3"]

  - name: "unknown_region_payer_count_7d"
    group: "region"
    definition: "Count of credit transactions from other-bank payers whose home region cannot be determined by this bank in the last 7 days."
    bank_visible_source_records: "PaymentSideRecord (counterparty_bank_id != this bank)"
    window_or_horizon: "7d (604800s)"
    empty_means: "zero"
    issue_ids: ["E3"]

  # -----------------------------------------------------------------------------
  # Group: network
  # -----------------------------------------------------------------------------
  - name: "hops_to_confirmed_label"
    group: "network"
    definition: "Shortest network path distance (hops) to an account confirmed as a mule or fraudster."
    bank_visible_source_records: "Graph network state / confirmed labels"
    window_or_horizon: "graph horizon"
    empty_means: "no data"
    issue_ids: ["G1"]

  - name: "shared_counterparties_with_flagged_7d"
    group: "network"
    definition: "Count of counterparties shared between this account and accounts flagged as suspicious in the last 7 days."
    bank_visible_source_records: "PaymentSideRecord, flagged accounts"
    window_or_horizon: "7d (604800s)"
    empty_means: "zero"
    issue_ids: ["G1"]

  - name: "local_cluster_density"
    group: "network"
    definition: "Clustering coefficient / local density of the transaction sub-network around this account."
    bank_visible_source_records: "PaymentSideRecord graph"
    window_or_horizon: "graph horizon"
    empty_means: "no data"
    issue_ids: ["G1"]

  - name: "hops_to_complained_account"
    group: "network"
    definition: "Shortest network path distance (hops) to an account with registered 1930/NCRP fraud complaints."
    bank_visible_source_records: "Graph network state / complaint records"
    window_or_horizon: "graph horizon"
    empty_means: "no data"
    issue_ids: ["G1"]

  # -----------------------------------------------------------------------------
  # Group: intelligence
  # -----------------------------------------------------------------------------
  - name: "registry_match_count"
    group: "intelligence"
    definition: "Number of this account's identifiers (account hash plus visible lifetime fingerprints) matching active listings on the national registry."
    bank_visible_source_records: "DPIP /screen registry matches"
    window_or_horizon: "account lifetime"
    empty_means: "no data"
    issue_ids: ["G1", "R8"]

  - name: "registry_match_age_days"
    group: "intelligence"
    definition: "Whole days between the earliest first_visible_at of any matching identifier and the decision time."
    bank_visible_source_records: "DPIP /screen registry first_visible_at"
    window_or_horizon: "account lifetime"
    empty_means: "no data"
    issue_ids: ["G1", "R8"]

  # -----------------------------------------------------------------------------
  # Group: payment_level
  # -----------------------------------------------------------------------------
  - name: "payee_registry_match"
    group: "payment_level"
    definition: "Boolean indicator whether the candidate payment payee's account matches an active fraud listing on the national registry."
    bank_visible_source_records: "DPIP /screen registry matches"
    window_or_horizon: "payment moment"
    empty_means: "no data"
    issue_ids: ["R8"]

  - name: "first_payment_to_payee"
    group: "payment_level"
    definition: "Binary flag indicating whether this is the payer's first recorded payment to this specific payee."
    bank_visible_source_records: "PaymentSideRecord, account_summaries counterparty days"
    window_or_horizon: "account lifetime"
    empty_means: "no data"
    issue_ids: ["R8"]

  - name: "amount_vs_payer_median_ratio"
    group: "payment_level"
    definition: "Ratio of the candidate payment amount to the payer's historical median payment amount."
    bank_visible_source_records: "PaymentSideRecord, account_summaries"
    window_or_horizon: "summary_horizon_days (62d)"
    empty_means: "no data"
    issue_ids: ["G1"]

  - name: "amount_vs_payer_max_ratio"
    group: "payment_level"
    definition: "Ratio of the candidate payment amount to the payer's historical maximum payment amount."
    bank_visible_source_records: "PaymentSideRecord, account_summaries"
    window_or_horizon: "summary_horizon_days (62d)"
    empty_means: "no data"
    issue_ids: ["G1"]

  - name: "payee_same_bank_risk"
    group: "payment_level"
    definition: "Internal risk tier or score of the payee if the payee holds an account at the same bank."
    bank_visible_source_records: "Internal bank risk profile"
    window_or_horizon: "point-in-time"
    empty_means: "no data"
    issue_ids: ["R8"]

  - name: "hour_ist"
    group: "payment_level"
    definition: "Hour of the transaction in Indian Standard Time (0 to 23)."
    bank_visible_source_records: "PaymentSideRecord.event_time"
    window_or_horizon: "payment moment"
    empty_means: "no data"
    issue_ids: ["G1"]

  - name: "payee_type"
    group: "payment_level"
    definition: "Payee classification as person or merchant based on account numbering prefix."
    bank_visible_source_records: "PaymentSideRecord.payee_type"
    window_or_horizon: "payment moment"
    empty_means: "no data"
    issue_ids: ["R8"]

  - name: "customer_failed_attempts_24h"
    group: "payment_level"
    definition: "Count of failed transaction attempts in the last 24 hours where failure_domain is 'customer'."
    bank_visible_source_records: "PaymentSideRecord (status='failed', failure_domain='customer')"
    window_or_horizon: "24h (86400s)"
    empty_means: "zero"
    issue_ids: ["R7"]

# =============================================================================
# Parked candidate features awaiting architectural rulings
# =============================================================================
pending: []

# =============================================================================
# Excluded and removed candidate features with explicit technical rationales
# =============================================================================
removed:
  - name: "emulator_flag"
    reason: "not visible to banks in this simulator: no such account-event kind"

  - name: "remote_access_flag"
    reason: "not visible to banks in this simulator: no such account-event kind"

  - name: "channel"
    reason: "every simulated payment is upi_app; a constant column teaches nothing"

gap_notes:
  - "bill payments are detected as recurring merchant payments (no biller payee type)"
  - "crypto cash-out reaches the bank as an ordinary transfer to a person account, so it is counted in outflow_to_person and cannot be told apart (G2)"
  - "in a mule-to-mule hop the sending side is also a mule and the credit-side rule does not label it; this is a safe miss, never a wrong label"
