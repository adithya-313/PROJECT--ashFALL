# File: docker-compose.yml
# Purpose: Orchestrates the local development environment for PROJECT-ashFALL services:
#           - api: FastAPI ASGI application with Gunicorn + uvloop
#           - postgres: PostgreSQL 15 with logical replication (wal_level=logical)
#           - redis: Redis 7 for high-speed feature caching and rate limiting
#           - prometheus: Metrics collection server
#           - grafana: Dashboards and observability visualization
#
# GPU passthrough: requests exactly 1 NVIDIA GPU for the API service, matching the RTX 4050.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Best-effort startup ordering. fluentd-async is the real safety net that prevents failures if fluent-bit isn't up.
      fluent-bit:
        condition: service_started
    logging:
      driver: "fluentd"
      options:
        fluentd-address: "localhost:24224"
        # Prevents api container startup failure or blocking if the fluent-bit listener isn't fully ready
        fluentd-async: "true"
        # Tag logs with the service name for easy filtering in Loki
        tag: "api"
    # GPU passthrough for the api service is handled at runtime via --gpus all
    # when needed locally. It is not required for the service to boot and is
    # intentionally omitted here so CI runners without a GPU can start the stack.

  postgres:
    image: postgres:15
    command: ["postgres", "-c", "wal_level=logical"]
    # Credentials are read from .env so they are never hardcoded here.
    # The three POSTGRES_* variables must be present in .env.
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./infra/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:10.4.2
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

  fluent-bit:
    # Official Fluent Bit image (v3.1) which includes the Loki output plugin natively.
    image: fluent/fluent-bit:3.1
    ports:
      - "24224:24224"
    volumes:
      - ./infra/docker/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
    depends_on:
      - loki

  loki:
    # Official Grafana Loki image, version matching standard Grafana interoperability.
    image: grafana/loki:3.2.0
    ports:
      - "3100:3100"

  # Tempo is a trace storage backend — it receives traces from the API and stores
  # them so Grafana can query and display the full request journey across services.
  tempo:
    image: grafana/tempo:2.4.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/docker/tempo.yaml:/etc/tempo.yaml
    ports:
      - "3200:3200"   # Tempo query API
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

  # Triton Inference Server — serves the winning fraud XGBoost model (ONNX) over gRPC (Level 5, sub-phase 5.7).
  #
  # Why this profile exists: the Triton image is ~10 GB from NVIDIA's registry.
  # Pulling it blocks normal `docker compose up` and times out in CI, so it only starts when asked for.
  # To start ONLY Triton, run: docker compose --profile serving up triton
  # (The older profile name "gpu" still works too. Triton runs on the CPU here, so "serving" is the accurate name.)
  triton:
    image: nvcr.io/nvidia/tritonserver:24.01-py3
    # --model-repository points at the folder holding fraud_xgboost/<version>/model.onnx and its config.pbtxt.
    # (Earlier this mounted the whole models/ folder, but Triton would have treated every sub-folder there as a model.)
    command: tritonserver --model-repository=/models
    ports:
      # gRPC (inference requests) and Prometheus metrics. The HTTP port (8000 inside the container) is
      # deliberately NOT published: host port 8000 already belongs to the FastAPI service.
      - "8001:8001"
      - "8002:8002"
    profiles:
      - serving
      - gpu
    volumes:
      # Read-only: Triton only needs to read the model files. The folder is a dedicated model repository under serving/.
      - ./serving/model_repository:/models:ro

volumes:
  postgres_data:
  grafana_data:
