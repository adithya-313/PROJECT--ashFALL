# File: docker-compose.yml
# Purpose: Orchestrates the local development environment for PROJECT-ashFALL services:
#           - api: FastAPI ASGI application with Gunicorn + uvloop
#           - postgres: PostgreSQL 15 with logical replication (wal_level=logical)
#           - redis: Redis 7 for high-speed feature caching and rate limiting
#           - prometheus: Metrics collection server
#           - grafana: Dashboards and observability visualization
#
# GPU passthrough: requests exactly 1 NVIDIA GPU for the API service, matching the RTX 4050.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Best-effort startup ordering. fluentd-async is the real safety net that prevents failures if fluent-bit isn't up.
      fluent-bit:
        condition: service_started
    logging:
      driver: "fluentd"
      options:
        fluentd-address: "localhost:24224"
        # Prevents api container startup failure or blocking if the fluent-bit listener isn't fully ready
        fluentd-async: "true"
        # Tag logs with the service name for easy filtering in Loki
        tag: "api"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  postgres:
    image: postgres:15
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ashfall
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./infra/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning/datasources/prometheus.yaml:/etc/grafana/provisioning/datasources/prometheus.yaml:ro
    depends_on:
      - prometheus

  fluent-bit:
    # Official Fluent Bit image (v3.1) which includes the Loki output plugin natively.
    image: fluent/fluent-bit:3.1
    ports:
      - "24224:24224"
    volumes:
      - ./infra/docker/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
    depends_on:
      - loki

  loki:
    # Official Grafana Loki image, version matching standard Grafana interoperability.
    image: grafana/loki:3.2.0
    ports:
      - "3100:3100"

volumes:
  postgres_data:
