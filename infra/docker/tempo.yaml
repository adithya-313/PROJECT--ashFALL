# File: infra/docker/tempo.yaml
# Purpose: Configuration for the Grafana Tempo trace storage service.
# This tells Tempo which ports to listen on for incoming traces (OTLP over gRPC and HTTP),
# and where to store trace data on disk inside the container.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/blocks
    wal:
      path: /tmp/tempo/wal
