# File: infra/grafana/provisioning/datasources/prometheus.yaml
# Purpose: Declarative datasource provisioning for Grafana.
# Connects: Automatically provisions Prometheus as the default datasource on container startup.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
