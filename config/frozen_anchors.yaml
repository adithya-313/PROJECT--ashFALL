# TERM: frozen anchor = a number or hash that Level 11 pinned and that stays fixed forever, so any later
#       change that moves it shows up as a failing test instead of a silent drift.
# TERM: fraud-off world = the Level 11 world run with no fraud added, exactly as Level 11 shipped it.
# TERM: SHA-256 hash = a 64-character fingerprint of some text; changing even one character of the text
#       gives a completely different fingerprint.
# TERM: canonical form = one fixed way of writing data (sorted keys, no spaces), so the same data always
#       gives the same text, and therefore the same hash, on Windows and on Linux.
