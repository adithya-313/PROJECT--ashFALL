# Pre-registered evaluation rules for the Level 10 engine.
#
# This file is pre-registered: it must be committed BEFORE any new-engine
# model is trained. The git commit date of this file is the proof.
# The reasoning behind each value is in docs/decisions/level-10-evaluation-decisions.md.
#
# Each decision block has a "label" (assumption or policy) and a "reason".
#   assumption = no public source exists, this is our best guess.
#   policy     = our own choice about how results are judged.

meta:
  level: 10
  author: adithya-313
  status: pre-registered

capacity:
  label: assumption
  sweep_min_pct_active_accounts_per_day: 0.05
  sweep_max_pct_active_accounts_per_day: 1.0
  headline_pct_active_accounts_per_day: 0.25
  report_full_curve: true
  reason: Real review capacity is not public, so the whole curve is reported and 0.25 is only the headline.

fair_comparison:
  label: policy
  method: match_operating_points
  tuned_on: validation_worlds
  main_genuine_restriction_rate_pct: 0.5
  extra_genuine_restriction_rate_pct: [0.25, 1.0]
  report_full_tradeoff_curve: true
  reason: Matching the genuine-restriction rate removes unequal harm from the comparison, and tuning on validation worlds, never test worlds, avoids peeking.

ml_beats_rules:
  label: policy
  all_conditions_must_hold: true
  min_median_recall_difference_points: 5
  min_share_of_test_worlds_ml_wins_pct: 70
  confidence_level_pct: 95
  confidence_interval_method: bootstrap_across_worlds
  interval_must_exclude_zero: true
  reason: Each condition blocks a different way of fooling ourselves - a small gap, a gap concentrated in a few worlds, and a gap due to luck.
  min_test_worlds:
    value: 20
    label: assumption
    reason: This is a suggestion needed for the 70% and bootstrap rules to be meaningful, and it may be changed ONLY before any new-engine model is trained.

latency:
  label: assumption
  endpoint: "POST /v1/decisions"
  percentile: 99
  max_ms: 100
  measured: server_side
  world_for_payment_rate: small
  warm_up_required: true
  hardware: author_laptop
  feature_computation_max_ms: 50
  reason: No public or legal limit exists, and the "30-60 seconds" figure was only a conference comment, so a stricter number is chosen on purpose.

# Amended 2026-10-10 (issues L3, N4, A2, E1; review items R3, R4).
# Logged in docs/research/amendments.md. No model code exists yet.

money_held_and_returned:
  label: policy
  issue_ids: [L3, R3]
  held_means: Victim money placed under lien or held in time, as a share of stolen money.
  returned_means: Victim money actually given back to victims after the slow release step, as a share of stolen money.
  always_report_both: true
  reason: Holding money is not the same as returning it. A lien can take weeks to become money back in the victim's hands, so a single "recovered" number would overstate success.

base_rate_reweighting:
  label: policy
  issue_ids: [E1, R4]
  applies_to: [yield_rate, false_alarms_per_day]
  report: both as measured and re-weighted to the real-world base rate
  inflation_factor_comes_from: the world card of each world
  real_world_ratio_comes_from: a parameter that Level 11 adds to config/world_ranges.yaml (no number is written here on purpose)
  reason: Small simulated worlds hold far more fraud than real life, so precision-style numbers look better than they would in practice. Re-weighting shows the honest version beside the raw one.

genuine_harm:
  label: policy
  issue_ids: [A2, N4, R3]
  counts:
    - Genuine accounts restricted, and restriction-days (vulnerable personas weighted higher).
    - Genuine shops downstream of mules that were restricted or had money pulled back.
    - Days a genuine account waits before a wrong lien is released.
    - Warnings shown to genuine payers.
  reason: Harm is not only "accounts frozen". Genuine shops that sold goods to mules, and people waiting for a wrong lien to be lifted, are real harm. The fair_comparison block above stays unchanged.

held_out_tactics:
  label: policy
  used_only_in: [test_worlds, stress_worlds]
  tactics: [slow_drip, device_rotation, pseudo_merchant_camouflage, fake_routine_life]
  kept_in_training: [basic_merchant_mule]
  reason: Each held-out tactic attacks one signal family, so a failure shows which signal is fragile.

world_splits:
  - name: training
    purpose: The model learns here.
  - name: validation
    purpose: Thresholds are tuned here.
  - name: test
    purpose: Final judgement.
  - name: stress
    purpose: Extreme conditions.

# Added for Level 12a (amendments A-013 and A-015). The pre-registered blocks above are unchanged.
#
# TERM: AUPRC = area under the precision-recall curve; 1.0 means a perfect ranking of fraud above genuine payments.
# TERM: trivial world = a world where one single feature separates fraud so well that any model would look good.
# TERM: fraud share = the fraction of payments in a world that are fraud; AUPRC is only meaningful beside it.
trivial_world_check:
  label: policy
  issue_ids_v2: [12-6]
  derived_from: "amendment A-013"
  metric: best_single_feature_auprc
  fail_threshold: 0.90
  report_top_features: 3
  report_alongside: fraud_share
  run_on: validation_worlds
  reason: PaySim was rejected in Level 9 because single features separated fraud almost perfectly. 0.90 marks "almost perfectly"; it is a policy decision, not a measurement. A failing world is fixed, never the threshold, and the check never runs on test or stress worlds (rule 17).

validation_worlds:
  label: policy
  issue_ids_v2: [12-18]
  derived_from: "amendment A-015"
  ranges: training
  seeds: independent of training seeds; disjointness enforced in 12f
  used_for: tuning (ground rule 17)
  counts: decided in 12f from measured run time
  reason: Tuning needs a split of its own, otherwise it would happen on training or test worlds and leak into the final judgement.

earlier_work_note: >-
  The v1 PaySim model, its data split and its thresholds (0.5, 0.42, 0.03)
  existed before this file. They are EXCLUDED from the pre-registered
  comparisons, which apply to the new engine and its worlds only.

not_decided_here:
  - exact world counts for training, validation and stress
  - rules-baseline details
  - thresholds for the other metrics
  - success criteria for tracing
  - success criteria for least-harm actions
  - success criteria for shared intelligence
  - weights for vulnerable personas in genuine harm
  - how long a wait for a wrong lien to be released counts as too long
