# Pre-registered evaluation rules for the Level 10 engine.
#
# This file is pre-registered: it must be committed BEFORE any new-engine
# model is trained. The git commit date of this file is the proof.
# The reasoning behind each value is in docs/decisions/level-10-evaluation-decisions.md.
#
# Each decision block has a "label" (assumption or policy) and a "reason".
#   assumption = no public source exists, this is our best guess.
#   policy     = our own choice about how results are judged.
#
# KEY CONCEPTS AND LABELS USED ACROSS THIS FILE:
# - label: assumption = No public data or regulation exists, so this number is our best estimate.
#   It can be refined only before model training begins.
# - label: policy = Our deliberate design rule on how systems are compared and judged.
#   It reflects project evaluation standards, not empirical guesses.
# - issue_ids_v2 = Tracked audit requirement identifiers in config/issues_v2.yaml that this block satisfies.
# - derived_from = The formal amendment identifier in docs/research/amendments.md that defined or amended this block.
# - validation worlds = Simulated worlds with training ranges used exclusively to tune decision thresholds without peeking at test data.
# - test worlds = Fresh, unseen simulated worlds used for final, unbiased benchmark comparisons between ML and rules.
# - stress worlds = Simulated worlds running under extreme conditions (bursts, outages, delays) to probe edge-case limits.

# ===== meta =====
# WHAT IT IS: Administrative metadata identifying the engine milestone, file author, and pre-registration status.
# WHY IT EXISTS: Proves that evaluation rules were committed to version control before any new-engine models were trained.
# EACH SETTING:
#   level: Milestone level of the simulation engine (count); 10 means Level 10 pre-registration rules.
#   author: GitHub handle of the engineer defining the rules (text); adithya-313 is the sole author.
#   status: Rule lifecycle state (text); "pre-registered" means frozen before model training code exists.
# EXAMPLE: level: 10 indicates that these rules govern the Level 10 evaluation framework and cannot be modified retroactively.
# SOURCE: docs/decisions/level-10-evaluation-decisions.md (Status and Proof sections).
meta:
  level: 10
  author: adithya-313
  status: pre-registered

# ===== capacity =====
# WHAT IT IS: Limits how many active bank accounts human investigation teams can review each day.
# WHY IT EXISTS: Prevents algorithms from gaming recall by flagging thousands of accounts that real bank staff could never inspect.
# EACH SETTING:
#   label: Block classification (text); "assumption" because banks keep investigation team sizes confidential.
#   sweep_min_pct_active_accounts_per_day: Lower capacity bound evaluated on trade-off curves (%); 0.05% of active accounts.
#   sweep_max_pct_active_accounts_per_day: Upper capacity bound evaluated on trade-off curves (%); 1.0% of active accounts.
#   headline_pct_active_accounts_per_day: Primary operating capacity reported in headline tables (%); 0.25% of active accounts.
#   report_full_curve: Whether to plot performance across the entire sweep range (boolean); true ensures conclusions do not rely on one guess.
#   reason: Written justification for sweeping capacity rather than relying on a single static guess.
# EXAMPLE: 0.25 means reviewers can check 1 in every 400 active accounts per day (25 daily reviews in a bank with 10,000 active accounts).
# SOURCE: docs/decisions/level-10-evaluation-decisions.md Section D1.
capacity:
  label: assumption
  sweep_min_pct_active_accounts_per_day: 0.05
  sweep_max_pct_active_accounts_per_day: 1.0
  headline_pct_active_accounts_per_day: 0.25
  report_full_curve: true
  reason: Real review capacity is not public, so the whole curve is reported and 0.25 is only the headline.

# ===== fair_comparison =====
# WHAT IT IS: Enforces comparing machine learning and rules at matched rates of customer account restrictions.
# WHY IT EXISTS: Stops an aggressive detector from claiming victory when it only caught more fraud by blocking more innocent customers.
# EACH SETTING:
#   label: Block classification (text); "policy" because matching customer harm is our chosen benchmark principle.
#   method: Threshold alignment algorithm (text); "match_operating_points" calibrates cutoffs to equalize genuine restriction rates.
#   tuned_on: Split used to calibrate thresholds (text); "validation_worlds" ensures thresholds are selected without peeking at test results.
#   main_genuine_restriction_rate_pct: Primary allowed false restriction ceiling (%); 0.5% of genuine accounts wrongly restricted.
#   extra_genuine_restriction_rate_pct: Additional sensitivity check ceilings (list of %); [0.25%, 1.0%] to test robustness across budgets.
#   report_full_tradeoff_curve: Whether to report the complete catch versus restriction trade-off (boolean); true shows the full operating spectrum.
#   reason: Written justification explaining that matching false alarm rates prevents hidden customer harm.
# EXAMPLE: At main rate 0.5%, both ML and rules thresholds are tuned so neither restricts more than 5 out of every 1,000 genuine accounts.
# SOURCE: docs/decisions/level-10-evaluation-decisions.md Section D2.
fair_comparison:
  label: policy
  method: match_operating_points
  tuned_on: validation_worlds
  main_genuine_restriction_rate_pct: 0.5
  extra_genuine_restriction_rate_pct: [0.25, 1.0]
  report_full_tradeoff_curve: true
  reason: Matching the genuine-restriction rate removes unequal harm from the comparison, and tuning on validation worlds, never test worlds, avoids peeking.

# ===== ml_beats_rules =====
# WHAT IT IS: The three statistical tests a machine learning model must pass in unseen test worlds to prove it outperforms the rules baseline.
# WHY IT EXISTS: Prevents declaring victory based on a tiny gain, an advantage in only a couple of lucky worlds, or random sampling chance.
# EACH SETTING:
#   label: Block classification (text); "policy" because these success criteria are our chosen evaluation standard.
#   all_conditions_must_hold: Strict combination rule (boolean); true means ML must meet all three statistical conditions at the same time.
#   min_median_recall_difference_points: Minimum required gap in median fraud catch rate (percentage points); 5 points means ML must beat rules by at least 5% across test worlds.
#   min_share_of_test_worlds_ml_wins_pct: Minimum fraction of individual test worlds where ML catches more fraud than rules (%); 70% ensures ML wins consistently across diverse scenarios.
#   confidence_level_pct: Statistical certainty level for the difference interval (%); 95% provides standard assurance that the win is not due to chance.
#   confidence_interval_method: Resampling algorithm used to compute the confidence interval (text); "bootstrap_across_worlds" repeatedly samples world results to check consistency.
#   interval_must_exclude_zero: Lower bound requirement for the confidence interval (boolean); true means the entire 95% confidence interval must stay strictly above zero.
#   reason: Written justification explaining that each condition stops a different way of fooling ourselves.
#   min_test_worlds: Minimum sample size of test worlds (nested map with count value: 20, label: "assumption", and reason); 20 worlds ensures bootstrap statistics and the 70% rule are reliable.
# EXAMPLE: If the rules baseline catches 60% of fraud, ML must catch at least 65% median fraud, win in at least 14 of 20 test worlds, and have a 95% bootstrap interval strictly greater than 0.
# SOURCE: docs/decisions/level-10-evaluation-decisions.md Section D3.
ml_beats_rules:
  label: policy
  all_conditions_must_hold: true
  min_median_recall_difference_points: 5
  min_share_of_test_worlds_ml_wins_pct: 70
  confidence_level_pct: 95
  confidence_interval_method: bootstrap_across_worlds
  interval_must_exclude_zero: true
  reason: Each condition blocks a different way of fooling ourselves - a small gap, a gap concentrated in a few worlds, and a gap due to luck.
  min_test_worlds:
    value: 20
    label: assumption
    reason: This is a suggestion needed for the 70% and bootstrap rules to be meaningful, and it may be changed ONLY before any new-engine model is trained.

# ===== latency =====
# WHAT IT IS: Maximum response time budget for the live payment fraud evaluation API endpoint.
# WHY IT EXISTS: Prevents deploying models that catch fraud accurately in batch simulations but run too slowly to approve real-time payments.
# EACH SETTING:
#   label: Block classification (text); "assumption" because no legal or published regulatory latency ceiling exists for fraud scoring.
#   endpoint: Target API route being benchmarked (text); "POST /v1/decisions" is the network endpoint where payments are submitted for real-time decisions.
#   percentile: Tail latency boundary being evaluated (percentile rank); 99 means 99 out of 100 requests must finish under the limit.
#   max_ms: Total allowable response time budget (milliseconds); 100 ms ensures decisions complete quickly enough for smooth payment flows.
#   measured: Measurement vantage point (text); "server_side" excludes external internet delays so only model and server execution time is measured.
#   world_for_payment_rate: Benchmark transaction volume scenario (text); "small" uses the payment arrival rate of a small simulated world.
#   warm_up_required: Requirement to run priming transactions before measuring (boolean); true ignores initial startup or caching delays.
#   hardware: Benchmark execution environment (text); "author_laptop" fixes standard local hardware specs for reproducible comparisons.
#   feature_computation_max_ms: Sub-budget reserved for computing signal features (milliseconds); 50 ms leaves the remaining 50 ms for model inference and overhead.
#   reason: Written justification noting that the 100 ms ceiling is chosen deliberately stricter than informal industry comments.
# EXAMPLE: Under the 99th percentile with a 100 ms limit, 99 out of every 100 API payment scoring requests must return a decision in 100 ms or less on the author laptop.
# SOURCE: docs/decisions/level-10-evaluation-decisions.md Section D4.
latency:
  label: assumption
  endpoint: "POST /v1/decisions"
  percentile: 99
  max_ms: 100
  measured: server_side
  world_for_payment_rate: small
  warm_up_required: true
  hardware: author_laptop
  feature_computation_max_ms: 50
  reason: No public or legal limit exists, and the "30-60 seconds" figure was only a conference comment, so a stricter number is chosen on purpose.

