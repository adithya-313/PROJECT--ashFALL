# ===== money_held_and_returned =====
# WHAT IT IS: Separates funds placed under temporary legal lien from funds actually restored to scam victims.
# WHY IT EXISTS: Prevents misleading claims where frozen money is counted as recovered even if victims wait months or never receive it.
# EACH SETTING:
#   label: Block classification (text); "policy" because separating held funds from returned funds is a non-negotiable reporting standard.
#   issue_ids: Audit tracking identifiers (list of codes); [L3, R3] map to legal hold realism and review audit requirements.
#   held_means: Operational definition of held funds (text); fraction of stolen money frozen under lien before it leaves the banking system.
#   returned_means: Operational definition of returned funds (text); fraction of stolen money actually handed back to victims after release.
#   always_report_both: Mandatory dual reporting flag (boolean); true forbids publishing a single combined recovery number.
#   reason: Written justification noting that placing a temporary lien is not the same as returning stolen money.
# EXAMPLE: If Rs 100,000 is stolen, freezing Rs 40,000 on lien but releasing Rs 10,000 to the victim must be reported as 40% held and 10% returned, never "40% recovered".
# SOURCE: docs/research/amendments.md Amendment A-001 (Issues L3, R3).
money_held_and_returned:
  label: policy
  issue_ids: [L3, R3]
  held_means: Victim money placed under lien or held in time, as a share of stolen money.
  returned_means: Victim money actually given back to victims after the slow release step, as a share of stolen money.
  always_report_both: true
  reason: Holding money is not the same as returning it. A lien can take weeks to become money back in the victim's hands, so a single "recovered" number would overstate success.

# ===== base_rate_reweighting =====
# WHAT IT IS: Mathematically adjusts raw simulation precision and alert volume to reflect real-world fraud rarity.
# WHY IT EXISTS: Prevents deceptive performance claims because simulated worlds pack much more fraud than real life, making precision look unrealistically high.
# EACH SETTING:
#   label: Block classification (text); "policy" because reporting honest real-world performance beside simulation metrics is required.
#   issue_ids: Audit tracking identifiers (list of codes); [E1, R4] map to economic realism and evaluation review requirements.
#   applies_to: Performance metrics requiring adjustment (list of metric names); [yield_rate, false_alarms_per_day] adjusts alert precision and daily false alarms.
#   report: Reporting requirement (text); mandates publishing both unadjusted simulation measurements and re-weighted real-world values.
#   inflation_factor_comes_from: Source for the simulation fraud concentration (text); read from the measured fraud inflation factor on each world card.
#   real_world_ratio_comes_from: Source for actual UPI network fraud incidence (text); references real_world_complaints_per_100000_upi_payments in config/world_ranges.yaml.
#   reason: Written justification explaining that higher simulation fraud density flatters raw precision numbers.
# EXAMPLE: In a world with 50 times more fraud than real life, a detector yielding 80% true fraud in simulation is re-weighted to show its honest real-world yield of under 10%.
# SOURCE: docs/research/amendments.md Amendments A-001 and A-012 (Issues E1, R4, 12-7).
base_rate_reweighting:
  label: policy
  issue_ids: [E1, R4]
  applies_to: [yield_rate, false_alarms_per_day]
  report: both as measured and re-weighted to the real-world base rate
  inflation_factor_comes_from: the world card of each world
  real_world_ratio_comes_from: a parameter that Level 11 adds to config/world_ranges.yaml (no number is written here on purpose)
  reason: Small simulated worlds hold far more fraud than real life, so precision-style numbers look better than they would in practice. Re-weighting shows the honest version beside the raw one.

# ===== genuine_harm =====
# WHAT IT IS: Measures the real-world collateral damage inflicted on innocent customers, merchants, and payers by anti-fraud actions.
# WHY IT EXISTS: Prevents defense systems from looking successful when they catch fraud only by freezing innocent people and disrupting legitimate commerce.
# EACH SETTING:
#   label: Block classification (text); "policy" because measuring and minimizing innocent customer disruption is an explicit design rule.
#   issue_ids: Audit tracking identifiers (list of codes); [A2, N4, R3] map to account action, national system, and review audit requirements.
#   counts: Specific customer harm metrics tracked across the simulation (list of strings):
#     - Genuine accounts restricted and duration in restriction-days, with higher penalty weight on vulnerable personas.
#     - Genuine merchant businesses downstream of mules whose payments were blocked or reversed.
#     - Days an innocent customer waits for an erroneous bank lien to be released.
#     - Friction warnings displayed to genuine legitimate payers during routine transfers.
#   reason: Written justification explaining that customer harm goes beyond simple frozen account tallies.
# EXAMPLE: Freezing an innocent shopkeeper's account for 5 days after a fraudster bought groceries there is recorded as 5 restriction-days and 1 affected downstream merchant.
# SOURCE: docs/research/amendments.md Amendment A-001 (Issues A2, N4, R3).
genuine_harm:
  label: policy
  issue_ids: [A2, N4, R3]
  counts:
    - Genuine accounts restricted, and restriction-days (vulnerable personas weighted higher).
    - Genuine shops downstream of mules that were restricted or had money pulled back.
    - Days a genuine account waits before a wrong lien is released.
    - Warnings shown to genuine payers.
  reason: Harm is not only "accounts frozen". Genuine shops that sold goods to mules, and people waiting for a wrong lien to be lifted, are real harm. The fair_comparison block above stays unchanged.

# ===== held_out_tactics =====
# WHAT IT IS: Keeps specific criminal evasion tactics completely out of training worlds so they appear only during test and stress evaluation.
# WHY IT EXISTS: Tests whether fraud detectors generalize to brand new adversarial tricks rather than merely memorizing patterns seen during training.
# EACH SETTING:
#   label: Block classification (text); "policy" because reserving evasion tactics for testing is our chosen evaluation methodology.
#   used_only_in: Evaluation partitions where held-out tactics are permitted to execute (list of split names); [test_worlds, stress_worlds] keeps them hidden from training and validation.
#   tactics: Criminal evasion techniques forbidden in training (list of tactic names); [slow_drip, device_rotation, pseudo_merchant_camouflage, fake_routine_life] each probe a distinct behavioral signal.
#   kept_in_training: Standard mule typologies allowed in training worlds (list of tactic names); [basic_merchant_mule] represents well-documented patterns that banks already know.
#   reason: Written justification noting that each held-out tactic attacks one signal family to reveal fragile detection logic.
# EXAMPLE: Testing on "slow_drip" checks whether a detector can catch stolen money split into tiny amounts below threshold without having seen that evasion in training.
# SOURCE: docs/decisions/level-10-evaluation-decisions.md Section D5 and docs/research/amendments.md Amendment A-014.
held_out_tactics:
  label: policy
  used_only_in: [test_worlds, stress_worlds]
  tactics: [slow_drip, device_rotation, pseudo_merchant_camouflage, fake_routine_life]
  kept_in_training: [basic_merchant_mule]
  reason: Each held-out tactic attacks one signal family, so a failure shows which signal is fragile.

# ===== world_splits =====
# WHAT IT IS: Defines the four strictly separated partitions used for simulated world generation and evaluation.
# WHY IT EXISTS: Prevents data leakage and overfitting by isolating model training, threshold tuning, benchmark evaluation, and stress testing.
# EACH SETTING:
#   name: Partition identifier (text); "training", "validation", "test", or "stress".
#   purpose: Role of that partition in the evaluation pipeline (text):
#     - training: Where machine learning models learn patterns and fit weights.
#     - validation: Where decision thresholds are calibrated without peeking at test results.
#     - test: Where final, unbiased benchmark comparisons between ML and rules occur.
#     - stress: Where systems run under extreme network conditions, delays, or bursts.
# EXAMPLE: A model fits internal parameters on training worlds, tunes its alert cutoff to 0.5% harm on validation worlds, and is scored once on test worlds for final judgement.
# SOURCE: docs/decisions/level-10-evaluation-decisions.md Sections D2, D3 and docs/research/amendments.md Amendment A-015.
world_splits:
  - name: training
    purpose: The model learns here.
  - name: validation
    purpose: Thresholds are tuned here.
  - name: test
    purpose: Final judgement.
  - name: stress
    purpose: Extreme conditions.

# Added for Level 12a (amendments A-013 and A-015). The pre-registered blocks above are unchanged.
#
# TERM: AUPRC = area under the precision-recall curve; 1.0 means a perfect ranking of fraud above genuine payments.
# TERM: trivial world = a world where one single feature separates fraud so well that any model would look good.
# TERM: fraud share = the fraction of payments in a world that are fraud; AUPRC is only meaningful beside it.

# ===== trivial_world_check =====
# WHAT IT IS: Quality control filter that rejects simulated validation worlds if fraud can be separated by any single obvious clue.
# WHY IT EXISTS: Prevents benchmarking models on unrealistically simplistic worlds where any naive rule would appear highly accurate.
# EACH SETTING:
#   label: Block classification (text); "policy" because the 0.90 failure ceiling is our chosen realism threshold, not a measurement.
#   issue_ids_v2: Tracked requirement identifier in config/issues_v2.yaml (list of codes); [12-6] tracks trivial world prevention.
#   derived_from: Originating amendment reference (text); "amendment A-013" in docs/research/amendments.md.
#   metric: Evaluated quality metric (text); "best_single_feature_auprc" computes the highest precision-recall area of any individual feature.
#   fail_threshold: Disqualification cutoff score (decimal score from 0.0 to 1.0); 0.90 means any world where a single feature reaches 0.90 AUPRC fails.
#   report_top_features: Number of leading predictive features to log (count); 3 shows which features separate fraud too easily.
#   report_alongside: Baseline context metric printed beside AUPRC (text); "fraud_share" provides the random baseline needed to interpret AUPRC.
#   run_on: Partition where this verification runs (text); "validation_worlds" ensures worlds are verified before model testing.
#   reason: Written justification noting that failing worlds must be fixed by making simulation harder, never by loosening the 0.90 bar.
# EXAMPLE: If a world allows a single feature like "payment amount" to achieve 0.91 AUPRC on its own, that world is rejected and its generator must be revised.
# SOURCE: docs/research/amendments.md Amendment A-013 (Issue 12-6).
trivial_world_check:
  label: policy
  issue_ids_v2: [12-6]
  derived_from: "amendment A-013"
  metric: best_single_feature_auprc
  fail_threshold: 0.90
  report_top_features: 3
  report_alongside: fraud_share
  run_on: validation_worlds
  reason: PaySim was rejected in Level 9 because single features separated fraud almost perfectly. 0.90 marks "almost perfectly"; it is a policy decision, not a measurement. A failing world is fixed, never the threshold, and the check never runs on test or stress worlds (rule 17).

# ===== validation_worlds =====
# WHAT IT IS: Configuration of the dedicated simulation partition reserved exclusively for calibrating decision thresholds.
# WHY IT EXISTS: Prevents data snooping and tuning leakage that occurs when models tune operating cutoffs on test worlds or overfit on training worlds.
# EACH SETTING:
#   label: Block classification (text); "policy" because isolating threshold tuning into a dedicated split is an evaluation rule.
#   issue_ids_v2: Tracked requirement identifier in config/issues_v2.yaml (list of codes); [12-18] tracks validation split isolation.
#   derived_from: Originating amendment reference (text); "amendment A-015" in docs/research/amendments.md.
#   ranges: Parameter range source (text); "training" draws scenario parameters from the same ranges as training worlds.
#   seeds: Random number generator seed specification (text); uses seeds completely independent and disjoint from training seeds.
#   used_for: Permitted role of this partition (text); "tuning (ground rule 17)" restricts usage strictly to calibrating decision thresholds.
#   counts: Number of validation worlds to run (text); deferred to Level 12f to be decided from measured simulation execution time.
#   reason: Written justification explaining that without a dedicated split, tuning leaks into training or final test evaluation.
# EXAMPLE: Detection thresholds matching genuine customer restriction to 0.5% are tuned on validation worlds so test worlds remain completely unseen.
# SOURCE: docs/research/amendments.md Amendment A-015 (Issue 12-18).
validation_worlds:
  label: policy
  issue_ids_v2: [12-18]
  derived_from: "amendment A-015"
  ranges: training
  seeds: independent of training seeds; disjointness enforced in 12f
  used_for: tuning (ground rule 17)
  counts: decided in 12f from measured run time
  reason: Tuning needs a split of its own, otherwise it would happen on training or test worlds and leak into the final judgement.

# ===== earlier_work_note =====
# WHAT IT IS: Formal exclusion statement separating prior prototype experiments from the new-engine pre-registered benchmark.
# WHY IT EXISTS: Prevents legacy models and tuned thresholds from being retroactively claimed as pre-registered evaluation results.
# EACH SETTING:
#   earlier_work_note: Explanatory text statement (text block); clarifies that v1 PaySim models, data splits, and thresholds (0.5, 0.42, 0.03) are excluded.
# EXAMPLE: A prototype model trained on legacy PaySim data cannot be cited as meeting the Level 10 evaluation hurdles.
# SOURCE: docs/decisions/level-10-evaluation-decisions.md Section Earlier work.
earlier_work_note: >-
  The v1 PaySim model, its data split and its thresholds (0.5, 0.42, 0.03)
  existed before this file. They are EXCLUDED from the pre-registered
  comparisons, which apply to the new engine and its worlds only.

# ===== not_decided_here =====
# WHAT IT IS: Explicit register of evaluation settings and parameters deliberately left open for future development milestones.
# WHY IT EXISTS: Prevents guessing or premature hardcoding of parameters that require empirical research or runtime benchmarking.
# EACH SETTING:
#   not_decided_here: List of 8 deferred evaluation decisions (list of topics):
#     - exact world counts for training, validation and stress (settled in Level 12f from measured execution speeds).
#     - rules-baseline details (defined in docs/research/rules_baseline_spec.md).
#     - thresholds for the other metrics (deferred until baseline metric distributions are observed).
#     - success criteria for tracing (deferred to mule network graph analysis milestones).
#     - success criteria for least-harm actions (deferred to response intervention design).
#     - success criteria for shared intelligence (deferred to inter-bank messaging milestones).
#     - weights for vulnerable personas in genuine harm (deferred until demographic persona calibration).
#     - how long a wait for a wrong lien to be released counts as too long (deferred until legal resolution timelines are modeled).
# EXAMPLE: Exact validation world count is omitted here and deferred to Level 12f so it can be set based on measured computer run time.
# SOURCE: docs/decisions/level-10-evaluation-decisions.md and docs/research/amendments.md Amendment A-001.
not_decided_here:
  - exact world counts for training, validation and stress
  - rules-baseline details
  - thresholds for the other metrics
  - success criteria for tracing
  - success criteria for least-harm actions
  - success criteria for shared intelligence
  - weights for vulnerable personas in genuine harm
  - how long a wait for a wrong lien to be released counts as too long
