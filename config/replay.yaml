# =====================================================================
# REPLAY WORKSPACE CONFIGURATION: configuration for Level 16b isolated
# replay workspaces across PostgreSQL, Redis, and Kafka.
# =====================================================================

replay_workspace:
  redis_workspace_db_min:
    label: policy
    value: 1
    reason: "Lowest Redis database index reserved for isolated replay workspaces; DB 0 is preserved for live traffic."
    derived_from: "Level 16b architect decisions C2 and 16b Q1"

  redis_workspace_db_max:
    label: policy
    value: 15
    reason: "Highest Redis database index reserved for replay workspaces, bounding the pool to 15 concurrent replays."
    derived_from: "Level 16b architect decisions C2 and 16b Q1"

  registry_key:
    label: policy
    value: "replay:workspace_registry"
    reason: "Redis hash key storing active workspace allocations in the live database."
    derived_from: "Level 16b architect decision 16b Q1"

  registry_lock_seconds:
    label: policy
    value: 10
    reason: "Lease duration in seconds for distributed lock guarding workspace allocation and release."
    derived_from: "Level 16b architect decision 16b Q1"

  drain_timeout_seconds:
    label: policy
    value: 30
    reason: "safety net, reaching it fails the replay"
    derived_from: "Level 16b architect decision 16b Q1 (safety net, reaching it fails the replay — used in 16b-3)"

  kafka_topic_partitions:
    label: policy
    value: 1
    reason: "Single partition per replay Kafka topic to guarantee total chronological event ordering."
    derived_from: "Level 16b architect decisions C2 and 16b Q1"

  decisions_per_event_payment:
    label: policy
    value: true
    reason: "replay and 16c datasets use one decision per executed attempt — architect P2(b)"

  kyc_phone_on_account_opened:
    label: policy
    value: true
    reason: "replay feeds carry the KYC phone on account_opened so banks can match phone hashes in the registry — architect 16d-0"
    derived_from: "architect 16d-0"

  world_registry_reporting:
    label: policy
    value: true
    reason: "replay datasets carry registry labels: world reports and the pre-world seed go through the in-process registry — architect 16d-1"
    derived_from: "architect 16d-1"

  replay_speed:
    label: policy
    value: "max"
    reason: 'Level 16 task 2 — "max" = no sleeping, limited only by the drain wait (architect Q3); a number = world seconds per real second'
    derived_from: "Level 16 task 2 and architect Q3"

  idle_partition_advance:
    label: policy
    value: true
    reason: "architect 16c-3 (b) — a quiet payment partition stalls the watermark; the replay proves the drain, so it may advance like the pollers"
    derived_from: "architect 16c-3 (b)"

  watermark_advance_skip_overlap:
    label: policy
    value: true
    reason: "The drain's watermark-advance step reads only rows after each poller cursor instead of re-applying the 200-row overlap tail; catch-up loops keep the overlap. Proven output-identical."
    derived_from: "Level 18a1-i verification on test-0000 tiny sampler seed 2: dataset identical to fixture test-20261031T1830-9a2856ce53b2 after run-id normalisation (0 differing rows in payments 2895, snapshots 2683, labels 8); drain.watermark_advance 1,684.5 s -> 49.8 s; wall 4,681 s -> 3,256 s; Redis commands 9.52 M -> 2.95 M"

  local_offset_tracking:
    label: policy
    value: false
    reason: "When true, the drain's payments-topic caught-up check uses local produced/consumed counters instead of asking the broker for end and committed offsets every drain; a broker cross-check runs at each snapshot boundary and at run end. Forced off when a replay hook is supplied."
    derived_from: "Level 18a1 profile on test-0000 tiny seed 2 (switch-on watermark run): drain.offset_check 1,491.8 s, drain.registry_poll 1,031.4 s of run.total 3,244.2 s; architect 18a1-ii"

  registry_poll_on_change:
    label: policy
    value: false
    reason: "When true, the registry drain skips getmany and offset calls while the local registry produced count equals the consumed count; the national outbox relay still runs every drain. Forced off when a replay hook is supplied."
    derived_from: "Level 18a1 profile on test-0000 tiny seed 2 (switch-on watermark run): drain.offset_check 1,491.8 s, drain.registry_poll 1,031.4 s of run.total 3,244.2 s; architect 18a1-ii"
