# Calibration ranges for genuine account opening rates during simulation execution.
#
# TERM: genuine account opening = natural creation of consumer or merchant accounts mid-run.
# TERM: opening rate = frequency of civilian bank accounts opened per thousand citizens over 30 days.
# TERM: shop opening share = proportion of mid-run newly opened accounts that belong to commercial shops.
#
# Checked by: python -m core.config_validator config/account_openings.yaml

parameters:
  genuine_account_openings_per_1000_people_per_30_days:
    label: assumption
    unit: rate per 1000 people per 30 days
    training: [2, 10]
    test: [2, 10]
    stress: [0, 40]
    issue_ids_v2: [12-19]
    derived_from: "assumption; world_ranges searched_but_not_found dormant or new account share"
    reason: "No Indian new-account share was found (world_ranges searched_but_not_found: 'dormant or new account share'); the range is deliberately wide so the 12g trivial-world check can test whether 'new account' separates mules."

  share_of_openings_that_are_shops:
    label: assumption
    unit: fraction
    training: [0.05, 0.2]
    test: [0.05, 0.2]
    stress: [0.0, 0.5]
    issue_ids_v2: [12-19]
    derived_from: "assumption; world_ranges searched_but_not_found dormant or new account share"
    reason: "No Indian new-account share was found (world_ranges searched_but_not_found: 'dormant or new account share'); the range is deliberately wide so the 12g trivial-world check can test whether 'new account' separates mules."
