# Issue register for the October 2026 world review (review item R6).
# Checked by: python -m core.issue_register
# It is also checked by tests/unit/test_issue_register.py, which runs in CI.
#
# status words
#   built    = the part owned by Level 11 Part 1 exists now and is checked
#              automatically (see evidence). later_work lists what later levels add.
#   planned  = nothing exists yet; a later level owns it (see later_work).
#   deferred = deliberately not built; reason says why.
# evidence kinds (the checker looks each one up for real)
#   config    = a block in a config file that lists this issue ID in issue_ids
#   amendment = an entry in docs/research/amendments.md whose Issue IDs row lists this ID
#   doc       = a doc file that contains the given text
#   test      = a test function that exists in the given file

