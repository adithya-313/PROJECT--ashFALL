# =====================================================================
# SCAM SCHEDULES: how scam victims pay a gang's receiving mules
# =====================================================================
#
# What this file is
#   When a gang's money comes from a scam, each victim is given a scam type
#   and a plan: how many times they pay, how far apart, how much, and
#   whether the mule pays something back. This file holds those rules.
#
# Who reads it
#   world/scam_config.py has one function per setting; world/scam_planner.py
#   draws the plans from them (the draw order is described in that file).
#
# The three scam types
#   investment          the victim is lured into paying for a "scheme"
#   job                 the victim pays for a "job" that does not exist
#   unauthorised_debit  money is taken from the victim's account without
#                       their say (after a takeover). Every other scam type
#                       is modelled this way for now.
#   Investment and job victims pay several times, each payment bigger than
#   the last, spread over days, and may get one small payment back to keep
#   them paying. Unauthorised-debit victims lose a few amounts within minutes
#   and get nothing back.
#
# How to read an entry
#   world_ranges_reference  the range lives in config/world_ranges.yaml,
#                           which also holds the label, source and reason;
#                           they are not copied here.
#   training / test / stress  for settings stored here: the range for each
#                           kind of world (training: what the detector
#                           learns from; test: the final exam; stress:
#                           extreme cases). Each world picks one value inside
#                           the range for its kind.
#   label / reason          "policy": our own rule; "assumption": a guess
#                           because nothing is published. Why is in reason.
#
# Where the full reasoning lives
#   docs/research/amendments.md (A-016); config/world_ranges.yaml for the
#   referenced ranges.
#
# Checked by: python -m core.config_validator config/scam_schedules.yaml
# =====================================================================

# ---------------------------------------------------------------------
# scam_type_shares: which scam type a victim gets
#
# The idea
#   Two draws per victim. First: investment-or-job, or the rest? The chance
#   is investment_or_job_share (training [0.55, 0.80], from world_ranges).
#   Second, for investment-or-job victims: investment, or job? The chance of
#   investment is investment_share_of_investment_or_job (training [0.4, 0.6],
#   close to even). Everyone else gets remainder_type, unauthorised_debit.
#   Each step of a gang draws its two chances once and uses them for all of
#   its victims.
#
# Example
#   With chances 0.7 and 0.5, a gang with 100 victims has about 35 investment,
#   35 job and 30 unauthorised-debit victims.
# ---------------------------------------------------------------------
scam_type_shares:
  label: policy
  reason: "Decides which scam type a victim gets: first investment-or-job against everything else, then investment against job. Everything else is modelled as an unauthorised debit for now."
  issue_ids_v2: [G6]
  derived_from: "amendment A-016"
  investment_or_job_share:
    label: policy
    world_ranges_reference: share_of_scams_investment_or_job
    reason: "Chance that a victim's scam is investment or job; read from config/world_ranges.yaml, where the Kerala Police 2025 figure and its label live."
  investment_share_of_investment_or_job:
    label: assumption
    unit: fraction
    training: [0.4, 0.6]
    test: [0.4, 0.6]
    stress: [0.1, 0.9]
    reason: "Kerala Police 2025 reported 34.8% trading and 33% job scams, close to even; one state only."
  remainder_type:
    label: policy
    value: unauthorised_debit
    reason: "Every scam type other than investment and job is modelled as an unauthorised debit for now."

# ---------------------------------------------------------------------
# investment_and_job_schedule: how an investment or job victim pays
#
# The idea
#   The victim's first payment falls at a random minute inside the receiving
#   mule's active window (mule_active_days_before_dropped in world_ranges.yaml);
#   payments that would fall after the window are dropped. Later
#   payments follow at random times inside the spread, each at least
#   min_minutes_between_victim_payments apart; each is the previous amount
#   times one escalation multiple. At most one payout comes back, at a time
#   strictly between the first and last payment.
#     payments_per_victim        how many payments (training [1, 6])
#     payment_spread_days        days they are spread over (training [0, 10])
#     first_payment_amount_inr   size of the first payment (training
#                                [2000, 50000] rupees)
#     payment_escalation_multiple  how many times larger the next payment is
#                                (training [1.0, 2.0]; 1.0 means no rise)
#     payout_back_share          share of what the victim has paid so far
#                                that comes back once (training [0.05, 0.3])
#     min_minutes_between_victim_payments 2: payments are never closer than
#                                2 minutes, so a payout always has a minute
#                                strictly between the first and last payment
#
# Example
#   A victim with 3 payments, a first payment of Rs 3,000 and a multiple of
#   1.5 pays Rs 3,000, Rs 4,500 and Rs 6,750.
# ---------------------------------------------------------------------
investment_and_job_schedule:
  label: policy
  reason: "Investment and job scams escalate: a victim pays several times, each payment larger than the last, spread over days."
  issue_ids_v2: [G6]
  derived_from: "amendment A-016"
  payments_per_victim:
    label: policy
    world_ranges_reference: scam_payments_per_victim
    reason: "How many times one victim pays; read from config/world_ranges.yaml."
  payment_spread_days:
    label: policy
    world_ranges_reference: scam_payment_spread_days
    reason: "Days over which one victim's payments are spread; read from config/world_ranges.yaml."
  first_payment_amount_inr:
    label: policy
    world_ranges_reference: mule_transfer_amount_inr
    reason: "Size of a victim's first payment; read from config/world_ranges.yaml. No figure exists for a first scam payment, so the mule transfer range is reused."
  payment_escalation_multiple:
    label: assumption
    unit: multiple of the previous payment
    training: [1.0, 2.0]
    test: [1.0, 2.0]
    stress: [1.0, 4.0]
    reason: "These scams escalate (see scam_payment_spread_days in config/world_ranges.yaml) but no multiple is published."
  payout_back_share:
    label: policy
    world_ranges_reference: scam_small_payout_back_share
    reason: "Share of what the victim has paid so far that the mule pays back once; read from config/world_ranges.yaml."
  min_minutes_between_victim_payments:
    label: policy
    value: 2
    unit: minutes
    reason: "Two payments of one victim are never closer than this, so the payout back always has a whole minute strictly after the first payment and strictly before the last."

# ---------------------------------------------------------------------
# unauthorised_debit_schedule: how an unauthorised-debit victim loses money
#
# The idea
#   After a takeover, a few debits follow within minutes of each other.
#     debit_payments     how many debits (training [1, 3])
#     debit_spread_minutes  minutes the debits are spread over (training
#                        [0, 60]); the first debit is at the victim's start
#                        minute, inside the mule's active window
#     debit_amount_inr   the size of each debit, drawn separately (training
#                        [2000, 50000] rupees)
#     payout_back false  nothing is paid back to these victims
#
# Example
#   A victim with 2 debits and a spread of 30 minutes loses one amount at
#   the start and another within the next 30 minutes.
# ---------------------------------------------------------------------
unauthorised_debit_schedule:
  label: policy
  reason: "After an account takeover the debits happen within minutes and there is no payout back, because there is no trust to build."
  issue_ids_v2: [G6]
  derived_from: "amendment A-016"
  debit_payments:
    label: assumption
    unit: count
    training: [1, 3]
    test: [1, 3]
    stress: [1, 10]
    reason: "Debits after a takeover happen within minutes (see complaint_delay_unauthorised_debit_minutes in config/world_ranges.yaml) but no count is published."
  debit_spread_minutes:
    label: assumption
    unit: minutes
    training: [0, 60]
    test: [0, 60]
    stress: [0, 240]
    reason: "Debits after a takeover happen within minutes (see complaint_delay_unauthorised_debit_minutes in config/world_ranges.yaml) but no spread is published."
  debit_amount_inr:
    label: policy
    world_ranges_reference: mule_transfer_amount_inr
    reason: "Size of each debit; read from config/world_ranges.yaml. No figure exists for a takeover debit, so the mule transfer range is reused."
  payout_back:
    label: policy
    value: false
    reason: "Nothing to build trust for after a takeover, so the mule pays nothing back."

# ---------------------------------------------------------------------
# victims_per_mule_tail_exponent: how uneven the victim counts are
#
# The idea
#   Most receiving mules get few victims and a few get very many (a "heavy
#   tail"). A gang draws a ceiling from victims_per_mule_largest (training
#   [10, 50]) and this exponent, and each mule's victim count follows a
#   power law up to the ceiling. A larger exponent means fewer very busy mules.
#   Training [1.8, 2.6].
#
# Source: world/scam_planner.py (the victim counts), world/scam_config.py.
# ---------------------------------------------------------------------
victims_per_mule_tail_exponent:
  label: assumption
  unit: power law exponent
  training: [1.8, 2.6]
  test: [1.8, 2.6]
  stress: [1.2, 3.5]
  issue_ids_v2: [G3]
  derived_from: "amendment A-016"
  reason: "No figure is published; chosen so most mules fall inside victims_per_mule_typical while a few reach victims_per_mule_largest."
