# =====================================================================
# LEVEL 11 SHOWCASE: the fixed settings of the demonstration
# =====================================================================
#
# What this file is
#   Level 11 builds a simulated India of everyday UPI payments (UPI is India's
#   instant payment system). The showcase is a command that builds that world
#   and runs 16 checks on it (python -m showcase --level 11). This file holds
#   the demonstration's chosen worlds and tolerances.
#
# Who reads it
#   showcase/level_11_checks.py reads festival_world, comparison_world,
#   tiny_world.n_people and expected_invariants.k_sigma.
#   tests/unit/world/test_frozen_anchors.py reads expected_invariants.events_sha256.
#   A search of the code found no other reader. Blocks nobody reads are marked
#   "NOT EXPLAINED IN SOURCE" below.
#
# Words used below
#   seed        a starting number; the same seed always gives the same world.
#   label       "policy" means: our own choice, not a fact about the world.
#   standard error (se)  the usual size of the random wobble in a count.
#               Counts like payments per day rise and fall by chance; an effect
#               only counts as real if it is several wobbles large.
#
# Where the full reasoning lives
#   docs/decisions/level-11d2-showcase-decisions.md
#
# Checked by: tests/unit/showcase/test_level_11_checks.py
# =====================================================================

# ---------------------------------------------------------------------
# tiny_world: the small standard world
#
# The idea
#   A world small enough to run in under a second: seed 101, 60 people,
#   12 shops, 61 days, training ranges. It is the world behind the frozen
#   fingerprint (see frozen_anchors.yaml).
#
# What the code reads
#   Only n_people (60): the festival check uses it to scale up to a bigger
#   world. The check builds its own tiny world with the same numbers
#   written in the code. The keys seed, n_shops, n_days and range_name are
#   NOT EXPLAINED IN SOURCE: nothing reads them.
# ---------------------------------------------------------------------
tiny_world:
  label: policy
  seed: 101
  n_people: 60
  n_shops: 12
  n_days: 61
  range_name: training
  reason: Canonical small world footprint used across golden benchmarks G2 and G3 to run deterministically in under 1 second.

# ---------------------------------------------------------------------
# festival_world: the bigger world used to see festivals
#
# The idea
#   Festivals raise the number of payments, but chance also moves the
#   counts. In the tiny world the rise is hard to tell from the wobble, so
#   the check uses a bigger world. The size rule was fixed BEFORE looking
#   at results: take the smallest size in candidate_people where
#     (extra payments the festival plan promises) / sqrt(payments expected
#     without festivals)
#   is at least min_planned_ratio. Shops = people / people_per_shop.
#     seed 101, n_days 61, range_name training  the world's recipe
#     candidate_people  sizes tried, smallest first
#     people_per_shop 5 -> one shop for every 5 people
#     min_planned_ratio 8.0 -> the planned rise must be 8 times the wobble
#
# Example
#   The predicted ratios are 1000 -> 5.11, 2000 -> 7.23, 4000 -> 10.23,
#   8000 -> 14.47. 4000 is the first at or above 8.0, so the world has
#   4000 people and 800 shops. A larger min_planned_ratio, such as 12,
#   would pick 8000 people and run slower.
#
# Source: docs/decisions/level-11d2-showcase-decisions.md (size rule);
#   showcase/level_11_checks.py (_run_festival_world).
# ---------------------------------------------------------------------
festival_world:
  label: policy
  seed: 101
  n_days: 61
  range_name: training
  candidate_people: [1000, 2000, 4000, 8000]
  people_per_shop: 5
  min_planned_ratio: 8.0
  reason: >-
    Large enough that Poisson noise is small next to the planned festival uplift. Size rule fixed before
    looking at results: the smallest candidate whose planned_excess / sqrt(expected_without), predicted from
    the plan's multipliers and the tiny world's base rate, is at least 8. On seed 101 the predicted ratios are
    1000 -> 5.11, 2000 -> 7.23, 4000 -> 10.23, 8000 -> 14.47, so the rule picks 4000 people and 800 shops.

# ---------------------------------------------------------------------
# comparison_world: the second world used to show seeds really differ
#
# The idea
#   The check runs seed 101 and this seed (102) side by side and compares
#   when festival peaks, outages and OS update days fall. At least 8 of the
#   10 compared timings must differ; if they were equal, the random
#   supplies would have collapsed into one.
#
# Example
#   Today the check reports "10 of 10 timings differ".
#
# Source: showcase/level_11_checks.py (run_seed_divergence_check).
# ---------------------------------------------------------------------
comparison_world:
  label: policy
  seed: 102
  reason: Adjacent seed used to demonstrate divergence in timing and event distribution across independent world runs.

# ---------------------------------------------------------------------
# chart_geometry: sizes and colours for the showcase charts
#
# NOT EXPLAINED IN SOURCE: ask the architect. A search found no code that
#   reads these keys. The reason line below says they match the design
#   guidelines for the showcase page (index.html).
# ---------------------------------------------------------------------
chart_geometry:
  label: policy
  viewbox_width: 1000
  viewbox_height: 300
  margin_left: 50
  margin_right: 20
  margin_top: 30
  margin_bottom: 40
  bar_color: "#1A2B48"
  bar_opacity: 0.22
  line_color: "#1A2B48"
  line_stroke_width: 2.4
  window_fill: "#FBEBD6"
  window_stroke: "#D9822B"
  window_label_color: "#9A5A17"
  window_label_font_size: 13
  reason: Visual geometry and color palette matching the design guidelines for the Level 11 showcase index.html.

# ---------------------------------------------------------------------
# expected_invariants: numbers the showcase expects to see
#
# The idea
#   k_sigma 4.0  how many wobbles (standard errors) count as proof. The
#   festival check passes only if the extra payments are more than 4
#   wobbles above zero AND within 4 wobbles of the amount the plan
#   promised. A larger k_sigma makes the check more forgiving.
#   events_sha256  the fingerprint of the tiny world's payment events. A
#   test checks that it equals the frozen anchor in frozen_anchors.yaml.
#
# NOT EXPLAINED IN SOURCE: ask the architect, for amendments_count,
#   issues_built, issues_planned, issues_deferred, grounding_total,
#   grounding_assumptions and grounding_reported. A search found no code
#   that reads them. (The 28/2/1 and 33/30/3 counts they repeat are
#   checked from frozen_anchors.yaml instead.)
#
# Source: showcase/level_11_checks.py (k_sigma);
#   tests/unit/world/test_frozen_anchors.py (events_sha256).
# ---------------------------------------------------------------------
expected_invariants:
  label: policy
  events_sha256: "24fc0e25009d79462d508f040a109620dd4308486cc78aee589393fe921f92fd"
  amendments_count: 11
  issues_built: 28
  issues_planned: 2
  issues_deferred: 1
  grounding_total: 33
  grounding_assumptions: 30
  grounding_reported: 3
  k_sigma: 4.0
  reason: Baseline counts and tolerances pinned to prevent regressions and verify empirical grounding across the world engine.
