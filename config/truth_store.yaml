# Configuration for the hidden truth store (Level 12b).
#
# TERM: hidden truth = facts known to the simulation engine but forbidden from bank feeds, including mule accounts,
#       controlling gangs, attack stories, and compromised devices.
# TERM: time span = a temporal interval [valid_from, valid_to) during which an account or device role remains active.
# TERM: half-open span = an interval inclusive of valid_from and exclusive of valid_to; valid_to may be None if unending.
# TERM: mule depth = distance in payment hops from the initial compromised victim to an illicit account (layer 1 is first mule).
# TERM: payment story = explanatory metadata attributing a fraud transaction to a gang, attack block, layer, and description.
#
# Checked by: python -m core.config_validator config/truth_store.yaml

truth_store:
  label: policy
  reason: "The truth store records ground truth about illicit accounts, devices, and attack narratives separately from operational feeds so that only evaluation and benchmark tooling can inspect them."
  issue_ids_v2: [12-1, 12-17, K5]
  derived_from: "ground rule 15; Level 12b brief task 5"
  format: "truth-v1"
  file_names:
    roles: "roles.jsonl"
    device_control: "device_control.jsonl"
    payment_stories: "payment_stories.jsonl"
    manifest: "manifest.json"
  file_names_reason: "Four separate truth-v1 artifacts capturing account roles, device control spans, transaction stories, and a cryptographic integrity manifest."
  roles:
    mule: "An intermediary account that receives and forwards laundered funds across payment hops"
    collector: "An account aggregating stolen proceeds from multiple victims before laundering"
    cash_out: "A terminal account used to withdraw illicit funds to cash or external instruments"
    victim: "An ordinary target account deceived or compromised into initiating unauthorized payments"
  roles_reason: "Ground rule 15; genuine is never stored as it is the default state of any account outside active spans"
  mule_origins: [rented, borrowed_kyc, business]
  mule_origins_reason: "How a gang came to control a mule account: rented from its ordinary owner, opened on borrowed identity documents, or opened as a business account. Stored only on mule spans so evaluation can compare origins."
  env_var: ASHFALL_TRUTH_DIR
  env_var_reason: "Location where the runner writes truth files; configured via a dedicated environment variable"
  allowed_reader_folders: [evaluation, showcase, tests]
  allowed_reader_folders_reason: "Only evaluation routines, showcase demonstrations, and unit tests are permitted to inspect hidden truth"
  ashfall_packages: [api, serving, features, models, online_learning, agent, core]
  ashfall_packages_reason: "Production operational packages must never access or depend on ground-truth fraud simulation labels"
