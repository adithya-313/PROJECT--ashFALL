# Building blocks for composing gang tactics and campaigns (Level 12b B-2a).
#
# TERM: building block = an atomic step in a fraud tactic campaign (acquire, warm_up, route, disguise).
# TERM: strength level = the level of sophistication and camouflage applied by a gang (strength 1 = fixed, strength 2 = camouflaged).
# TERM: dwell = the duration in simulated minutes money stays in an account before being forwarded.
# TERM: layer = the hop distance in a laundering payment chain from the source to terminal exit.
# TERM: budget = maximum allowed expenditure in money, time, and cumulative risk for a gang campaign.
# TERM: dividing line = boundary separating training tactics from held-out tactics to prevent data leakage.
#
# Checked by: python -m core.config_validator config/tactic_blocks.yaml

tactic_blocks:
  label: policy
  reason: "Catalogue of procedural building blocks used to specify gang laundering operations and attack tactics."
  issue_ids_v2: [12-8, 12-9]
  derived_from: "amendment A-014; amendment A-016"
  blocks:
    acquire:
      label: assumption
      reason: "No published figure; building block models account acquisition for comparison per amendment A-016."
      meaning: "Recruit or rent mule accounts from ordinary persons"
      allowed_strengths: [1, 2]
      time_minutes_per_use: [60, 1440]
      parameters:
        count:
          label: assumption
          world_ranges_reference: mules_per_gang
          split: training
          reason: "Number of mule accounts acquired by a gang per campaign, referenced from config/world_ranges.yaml"
        origin_mix:
          label: policy
          allowed_values: [all_rented, world_ranges]
          default: all_rented
          reason: "Where mule origins come from. all_rented takes every mule from the ordinary people of the world, as the 12b fixtures did before mule origins existed, and is the default when the parameter is left out; an omitted parameter records no origin in truth so those fixtures stay unchanged, while an explicit all_rented records origin rented. world_ranges draws each mule's origin from the mule_origin_share ranges."
    take_control:
      label: assumption
      reason: "No published figure; building block models unauthorized device takeover for comparison per amendment A-016."
      meaning: "Take control of acquired mule accounts via dedicated gang devices and compromise tooling"
      allowed_strengths: [1, 2]
      time_minutes_per_use: [10, 120]
      parameters:
        devices:
          label: assumption
          range: [1, 5]
          reason: "Number of external gang devices provisioned to control acquired mule accounts"
        sim_swap:
          label: policy
          type: boolean
          reason: "Whether SIM swapping was executed to divert two-factor SMS codes"
        linked_number_switch:
          label: policy
          type: boolean
          reason: "Whether the registered bank linked telephone number was altered"
        emulator:
          label: policy
          type: boolean
          reason: "Whether an emulator environment is used instead of a physical mobile device"
        remote_access:
          label: policy
          type: boolean
          reason: "Whether remote access software was installed to operate the session remotely"
    warm_up:
      label: assumption
      reason: "No published figure; building block models account seasoning for comparison per amendment A-016."
      meaning: "Age or season acquired accounts before moving illicit funds"
      allowed_strengths: [1, 2]
      time_minutes_per_use: "days x 1440"
      parameters:
        days:
          label: assumption
          world_ranges_reference: mule_warmup_days
          split: training
          reason: "Number of days spent letting acquired accounts season before routing, referenced from config/world_ranges.yaml"
    scam:
      label: assumption
      reason: "No published figure; building block models victims paying receiving mules for comparison per amendment A-016."
      meaning: "Victims pay acquired receiving mules; this is the gang's money source in place of a fixture source"
      allowed_strengths: [1, 2]
      time_minutes_per_use: "span of the victim payment schedule"
      parameters:
        receiving_mules:
          label: assumption
          range: [1, 10]
          reason: "Number of acquired mules that receive victim money; route accounts_per_layer must equal it"
        victims_per_receiving_mule:
          label: assumption
          world_ranges_reference: victims_per_mule_largest
          split: training
          reason: "Number of victims paying each receiving mule, upper bound referenced from config/world_ranges.yaml"
    route:
      label: assumption
      reason: "No published figure; building block models layered forwarding for comparison per amendment A-016."
      meaning: "Move money through layered mule accounts to obscure the audit trail"
      allowed_strengths: [1, 2]
      time_minutes_per_use: "hop dwell"
      parameters:
        layers:
          label: assumption
          range: [1, 5]
          reason: "Number of hops in the laundering chain from collector to exit"
        accounts_per_layer:
          label: assumption
          range: [1, 10]
          reason: "Number of mule accounts per layer"
        dwell_minutes:
          label: assumption
          world_ranges_reference: minutes_money_stays_in_mule_account
          split: training
          reason: "Dwell time money stays in intermediary mule account before forwarding, referenced from config/world_ranges.yaml"
        amount_inr:
          label: assumption
          world_ranges_reference: mule_transfer_amount_inr
          split: training
          reason: "Transfer amount per hop, referenced from config/world_ranges.yaml"
    disguise:
      label: assumption
      reason: "No published figure; building block models timing camouflage for comparison per amendment A-016."
      meaning: "Perturb payment timings inside the dwell window to camouflage against detection"
      allowed_strengths: [2]
      time_minutes_per_use: [0, 30]
      parameters:
        jitter_minutes:
          label: assumption
          range: [0, 30]
          reason: "Random minute offset applied to payment timings within dwell window"
    cash_out:
      label: assumption
      reason: "No published figure; building block models downstream extraction via crypto, ATM, branch, and genuine shops per Decision D3."
      meaning: "Extract stolen money from terminal mule accounts into physical cash, crypto, or genuine merchant goods"
      allowed_strengths: [1, 2]
      time_minutes_per_use: "cashing out window"
      parameters:
        channels:
          label: policy
          allowed_values: [crypto, atm, branch, genuine_shop]
          reason: "Cash-out distribution channels specified in config/cash_out.yaml"
    split_below_threshold:
      label: assumption
      reason: "No published figure; building block models splitting payments below a threshold for comparison per amendment A-016."
      meaning: "Split payments exceeding a threshold into smaller pieces to avoid reporting or rule limits"
      allowed_strengths: [1, 2]
      time_minutes_per_use: 0
      parameters:
        threshold_inr:
          label: assumption
          range: [10000, 50000]
          training: [10000, 50000]
          test: [10000, 50000]
          stress: [2000, 100000]
          reason: "Threshold in INR above which payments are split into pieces below it"

mule_origin_shares:
  label: policy
  reason: "Chances that an acquired mule is rented, opened on borrowed documents or opened as a business account when origin_mix is world_ranges. The three ranges in config/world_ranges.yaml are independent and do not sum to 1, so each draw is divided by the sum of the three before it is used."
  issue_ids_v2: [G1, 12-19]
  derived_from: "amendment A-016; config/world_ranges.yaml"
  rented:
    label: policy
    world_ranges_reference: mule_origin_share_rented
    new_account_owner_kind: null
    reason: "A rented mule is an existing ordinary account, so no account is opened for it; its share is read from config/world_ranges.yaml."
  borrowed_kyc:
    label: policy
    world_ranges_reference: mule_origin_share_borrowed_kyc
    new_account_owner_kind: person
    reason: "A borrowed-KYC mule is a new personal account opened on someone else's identity documents; its share is read from config/world_ranges.yaml."
  business:
    label: policy
    world_ranges_reference: mule_origin_share_business
    new_account_owner_kind: shop
    reason: "A business mule is a new business account, modelled as a shop account; its share is read from config/world_ranges.yaml."

rented_owner_activity:
  label: policy
  reason: "A rented mule keeps part of its owner's normal payments next to the illicit flows. The kept share is drawn once per rented mule; an outgoing owner payment inside the mule span is paused when a fresh draw is not below that share."
  issue_ids_v2: [G1]
  derived_from: "amendment A-016; config/world_ranges.yaml"
  kept_share:
    label: policy
    world_ranges_reference: rented_mule_owner_activity_kept_share
    reason: "Share of the owner's outgoing payments that a rented mule keeps; read from config/world_ranges.yaml, where its label and reason live."

held_out_dividing_lines:
  label: policy
  reason: "Dividing lines derived from world ranges to separate training tactics from held-out tactics per amendment A-014."
  issue_ids_v2: [12-8]
  derived_from: "amendment A-014; config/world_ranges.yaml"
  training_max_dwell_minutes:
    label: policy
    parameter_reference: minutes_money_stays_in_mule_account
    bound: upper
    split: training
    reason: "Upper bound of minutes_money_stays_in_mule_account training range; training routes must forward within this."
  slow_drip_max_amount_inr:
    label: policy
    parameter_reference: mule_transfer_amount_inr
    bound: lower
    split: training
    reason: "Lower bound of mule_transfer_amount_inr training range; training routes never send below it."
  training_devices_retired_on_schedule:
    label: policy
    value: false
    reason: "A rule; training tactics do not retire devices strictly on schedule; used in B-2b."

gang_payment_purpose:
  label: policy
  purpose: everyday
  reason: "Payment purposes stay world-side (ground rule 29) and Level 11's purpose list cannot grow, so gang payments, victim payments included, reuse everyday; the truth story carries the scam type."

gang_devices:
  label: policy
  reason: "External gang devices have neutral identifiers and generate synthetic device takeover events."
  issue_ids_v2: [12-8, 12-9]
  derived_from: "Decision E2; Decision E4"
  device_id_prefix: "dev_ext_"
  device_event_kinds:
    - device_acquired
    - sim_swap
    - linked_number_switch
    - emulator_enabled
    - remote_access_enabled

