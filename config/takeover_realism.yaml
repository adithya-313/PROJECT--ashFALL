    reason: "Device-intelligence vendors (2026) and CloudSEK (Mar 2024) report SIM swaps, linked-number replacement, emulators and remote access in mule operations; no share is published. Ranges follow the mule_origin_share shape. Chance that a generated gang uses the flag."

