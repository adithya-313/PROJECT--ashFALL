# =====================================================================
# RULES BASELINE: Untuned heuristic rule decision table and thresholds
# =====================================================================
# Status untuned_start: "starting value; replaced only by validation-world tuning in Level 17c; never used for reported test results"

thresholds:
  large_credit_amount_paise:
    value: 1000000
    label: policy
    reason: "Threshold for identifying single high-value inbound credits in paise."
    derived_from: "lowest value of account_features.reporting_thresholds_paise (₹10,000)"
    status: untuned_start

  outflow_share:
    value: 0.8
    label: policy
    reason: "Minimum ratio of credits disbursed within the window to flag rapid depletion."
    derived_from: 'policy: spec wording "most of it"'
    status: untuned_start

  time_window_seconds:
    value: 3600
    label: policy
    reason: "Maximum median credit-to-debit latency threshold defining rapid pass-through."
    derived_from: 'policy: spec "short time window"'
    status: untuned_start

  new_account_age_days:
    value: 30
    label: policy
    reason: "Maximum account age in days to classify an account as recently opened."
    derived_from: "policy"
    status: untuned_start

  payer_count:
    value: 10
    label: policy
    reason: "Minimum distinct payer count threshold indicating high fan-in velocity."
    derived_from: "policy"
    status: untuned_start

  near_zero_balance_paise:
    value: 10000
    label: policy
    reason: "Maximum remaining account balance in paise to qualify as depleted near-zero."
    derived_from: "account_features.near_zero_balance_max_paise"
    status: untuned_start

rules:
  - id: "rule_1"
    reason_code: "RB1_FAST_PASS_THROUGH"
    plain_english: "Large inbound credit followed by rapid pass-through within short time window"
    conditions:
      - feature: "largest_credit_paise_24h"
        op: ">="
        threshold: "large_credit_amount_paise"
      - feature: "pass_through_ratio_24h"
        op: ">="
        threshold: "outflow_share"
      - feature: "median_credit_to_debit_seconds_7d"
        op: "<="
        threshold: "time_window_seconds"

  - id: "rule_2"
    reason_code: "RB2_LARGE_CREDIT_NEW_ACCOUNT"
    plain_english: "Large inbound credit received on an account opened within 30 days"
    conditions:
      - feature: "largest_credit_paise_24h"
        op: ">="
        threshold: "large_credit_amount_paise"
      - feature: "account_age_days"
        op: "<="
        threshold: "new_account_age_days"

  - id: "rule_3"
    reason_code: "RB3_MANY_PAYERS_ONE_DAY"
    plain_english: "Unusually high number of distinct payers in a 24-hour window"
    conditions:
      - feature: "distinct_payers_24h"
        op: ">="
        threshold: "payer_count"

  - id: "rule_4"
    reason_code: "RB4_NEAR_ZERO_AFTER_OUTFLOW"
    plain_english: "Account balance drained near zero following large credit and high pass-through outflow"
    conditions:
      - feature: "current_balance_paise"
        op: "<="
        threshold: "near_zero_balance_paise"
      - feature: "pass_through_ratio_24h"
        op: ">="
        threshold: "outflow_share"
      - feature: "largest_credit_paise_24h"
        op: ">="
        threshold: "large_credit_amount_paise"

  - id: "rule_5"
    reason_code: "RB5_NEW_DEVICE_MONEY_MOVED"
    plain_english: "Money moved through account following access from a new device"
    conditions:
      # R5 — reads only new_device_r5, which is 0 on an OS update alone
      - feature: "new_device_r5"
        op: "=="
        threshold: 1
      - feature: "pass_through_ratio_24h"
        op: ">="
        threshold: "outflow_share"

