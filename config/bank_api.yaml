# =====================================================================
# BANK API: configuration for commercial bank UPI APIs and authentication
# =====================================================================

bank_api:
  label: policy
  reason: "Commercial bank endpoints and API authentication configuration for Level 14a and 14b."
  derived_from: "config/nationalsim.yaml"
  issue_ids_v2: [14-2, 14-9]
  banks:
    - bank_0
    - bank_1
    - bank_2
  api_key_secret_bytes: 32

  signature_max_age_seconds:
    label: policy
    value: 300
    reason: "allowed |now - timestamp| on the wall clock, both directions"
    derived_from: "finding 14-4"

  nonce_retention_seconds:
    label: policy
    value: 900
    reason: "must be >= 2 x signature_max_age_seconds to prevent replay attacks"
    derived_from: "replay window policy"

  idempotency_lifetime_hours:
    label: policy
    value: 24
    reason: "24-hour idempotency key retention window"
    derived_from: "API SLA"

  max_request_body_bytes:
    label: policy
    value: 65536
    reason: "maximum request body size 64KB"
    derived_from: "payload limit policy"

  bank_modes:
    label: policy
    value:
      bank_0: shadow
      bank_1: shadow
      bank_2: shadow
    reason: 'shadow = the answer is recorded and ignored, live = the bank may act only on "allow" until Level 19 (issue 14-6)'
    derived_from: "Level 14c plan task 5"
    issue_ids_v2: [14-6]

  max_amount_paise:
    label: policy
    value: 1000000000000
    reason: "upper guard on a payment amount (10 billion rupees) so a huge number can never overflow a BIGINT column"
    derived_from: "input validation policy"

  max_payment_ids_per_complaint:
    label: policy
    value: 50
    reason: "one complaint may name at most 50 payments, which keeps a single request small and bounded"
    derived_from: "payload limit policy"

  max_identifier_length:
    label: policy
    value: 128
    reason: "longest allowed payment, account, event or complaint identifier, matching the idempotency key limit"
    derived_from: "input validation policy"

  fuzz_max_examples_per_endpoint:
    label: policy
    value: 50
    reason: "laptop run time"

