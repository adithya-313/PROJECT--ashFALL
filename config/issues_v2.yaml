# Issue register v2: the findings of Revision 2 of the project report (Section 27, 16 October 2026), plus the
# Level 11 issues that later levels carry on. Level 11's own register, config/issues.yaml, is frozen and never edited.
#
# TERM: issue register = a list of every known problem with a status, so none is forgotten silently,
#       e.g. "12-6" is "built" because the trivial-world check is written down in the evaluation config.
# TERM: revision_2 = an ID first used in Revision 2, e.g. K1 or 12-7.
# TERM: level_11 = an ID that already exists in config/issues.yaml, e.g. G1; its v1_status is copied from there.
# TERM: evidence = a real thing that can be looked up to show the status is true: a config block, a test function,
#       an amendment or a document text. The checker opens each one.
# TERM: later_work = what a later level still has to do, written "Level N: what".
#
# status words
#   built    = done and checked now (see evidence).
#   partial  = part of it exists now (see evidence); later_work lists the rest.
#   planned  = nothing exists yet; a later level owns it.
#   deferred = deliberately not built; reason says why.
#
# Section 27 groups some findings on one row (for example 14-9, 14-11 and 14-12). Each ID has its own entry here
# and shares the finding text.
# Checked by: python -m core.issue_register_v2 and tests/unit/test_issue_register_v2.py

meta:
  label: policy
  reason: A second register is needed because the Level 11 register has a fixed set of 31 IDs that a test pins, so new findings cannot be added to it. Keeping them apart leaves every Level 11 count untouched.
  derived_from: "Project Report Revision 2, Section 27, 16 Oct 2026"
  statuses: [built, partial, planned, deferred]

