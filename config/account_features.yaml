# =====================================================================
# ACCOUNT FEATURES: configuration for Level 15 account feature updating,
# Redis sliding look-back windows, key lifecycle and table polling.
# =====================================================================

account_features:
  windows_seconds:
    label: policy
    value: [3600, 86400, 604800]
    reason: "Defines sliding look-back window intervals for account velocity features."
    derived_from: "Level 15 plan, M1 inflow group: 1 hour, 24 hours, 7 days"

  retention_seconds:
    label: policy
    value: 604800
    reason: "The largest window; anything older can never be read by any feature."
    derived_from: "Level 15 plan, M1 inflow group: 7 days"

  allowed_lateness_seconds:
    label: policy
    value: 86400
    reason: "events may arrive up to one simulated day late; anything later is outside the window the trim keeps"
    derived_from: "Level 15 architect decision 3 (trim cutoff = newest event time − (retention + allowed lateness))"

  key_expiry_margin_seconds:
    label: policy
    value: 86400
    reason: "Redis expiry TTL margin added to retention so quiet accounts are cleaned up without expiring valid window data."
    derived_from: "Level 15 plan, Redis key lifecycle policy"

  key_prefix:
    label: policy
    value: "acctf"
    reason: "Redis namespace prefix for Level 15 account feature structures, avoiding collision with existing keys."
    derived_from: "data-contract rule: Level 15 may add a prefix"

  run_id_source:
    label: policy
    path: "config/interactive_runner.yaml"
    key: "run_id_hex_length"
    value: "config/interactive_runner.yaml"
    reason: "Path to runner config specifying exact length of run identifiers."
    derived_from: "config/interactive_runner.yaml run_id_hex_length"

  account_event_batch_size:
    label: policy
    value: 500
    reason: "Batch size limit for polling bank account events table to bound memory usage and transaction lock times."
    derived_from: "Level 15 plan, account event ingestion batching"

  account_event_overlap_rows:
    label: policy
    value: 200
    reason: "re-read the tail of committed events so out-of-order transaction commits are not skipped"
    derived_from: "Level 15 architect decision 5"

  summary_horizon_days:
    label: policy
    value: 62
    reason: "Defines the summary look-back horizon in whole days for routine-life and counterparty features."
    derived_from: "two monthly cycles plus slack, because pay dates shift around weekends and holidays"

  routine_life_warm_up_days:
    label: policy
    value: 62
    reason: "Minimum history duration required before routine-life features mean anything."
    derived_from: "a world must run at least one horizon before routine-life features mean anything"

  fingerprint_warning_count:
    label: assumption
    value: 10
    reason: "Threshold of distinct device fingerprints above which a warning is logged naming the account."
    derived_from: "real accounts have few devices; more is itself a signal and is reported, never dropped"

  small_credit_max_paise:
    label: assumption
    value: 50000
    reason: "Threshold in paise for small incoming test or fan-in credits (₹500)."
    derived_from: "plan M1 table; placeholder until the Level 17 rules tuning"

  reporting_thresholds_paise:
    label: assumption
    value: [1000000, 5000000, 10000000]
    reason: "Regulatory reporting thresholds in paise (₹10,000, ₹50,000, ₹1,00,000)."
    derived_from: "plan M1 table; placeholder until the Level 17 rules tuning"

  below_threshold_band_fraction:
    label: assumption
    value: 0.05
    reason: "Structuring detection band fraction below reporting thresholds (5%)."
    derived_from: "plan M1 table; placeholder until the Level 17 rules tuning"

  near_zero_balance_max_paise:
    label: assumption
    value: 10000
    reason: "Threshold in paise below which an account balance is considered near zero (₹100)."
    derived_from: "plan M1 table; placeholder until the Level 17 rules tuning"

