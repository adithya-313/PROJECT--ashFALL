# =====================================================================
# NATIONALSIM: configuration for national shared mock systems (DPIP / I4C)
# =====================================================================

nationalsim:
  label: policy
  reason: "Configuration for mock national registry and DPIP systems (Level 13a, amendment A-027)."
  issue_ids_v2: [13-11, 13-12]
  derived_from: "policy (amendment A-027)"

  listing_delay_minutes:
    value: 15
    label: assumption
    reason: "Registry processing delay between ingestion receipt and visibility to screening; this is the registry's own processing time ON TOP of Level 12's registry_report_delay_minutes."
    issue_ids_v2: [13-11]
    derived_from: "policy (amendment A-027)"

  recycle_min_days:
    value: 90
    label: reported
    source:
      url: "https://api.sci.gov.in/supremecourt/2021/13468/13468_2021_3_45_47839_Judgement_30-Oct-2023.pdf"
      date: "2023-10-30"
      quote: "the cellular mobile telephone number once deactivated for non-usage or disconnected on the request of subscriber, is not allocated to the new subscriber for at least a period of 90 days."
    reason: "Supreme Court judgment (30 Oct 2023) records: \"the cellular mobile telephone number once deactivated for non-usage or disconnected on the request of subscriber, is not allocated to the new subscriber for at least a period of 90 days.\""
    derived_from: "Supreme Court of India (30 Oct 2023)"

  recycled_number_share:
    value: 0.05
    label: assumption
    derived_from: policy
    reason: "Assumed share of genuine customer accounts whose assigned mobile number was previously held by a mule account deactivated before day 0; no official industry figure is published."

  dispute_resolution_minutes:
    value: 60
    label: assumption
    derived_from: policy
    reason: "Assumed time in minutes taken by the national registry to verify telecom reassignment evidence and uphold a customer dispute; no statutory SLA is published."

  night_hours:
    value: [22, 6]
    label: assumption
    derived_from: policy
    reason: "Assumed off-hours window (22:00 to 06:00 IST) when banking back-office hold processing and 1930 operational triage operate with reduced staffing."

  night_multiplier:
    value: 2.0
    label: assumption
    derived_from: policy
    reason: "Assumed multiplier scaling hold latency during night hours due to skeleton staffing; no empirical inter-bank SLA is published."

  weekend_multiplier:
    value: 1.5
    label: assumption
    derived_from: policy
    reason: "Assumed multiplier scaling hold latency on Saturdays and Sundays when bank branch operations and fraud desks operate with reduced staffing."

  banks:
    bank_0:
      dpip_participation: true
    bank_1:
      dpip_participation: true
    bank_2:
      dpip_participation: true

  client_timeout_seconds:
    value: 2.0
    label: assumption
    derived_from: policy
    reason: "Strict 2.0s HTTP client timeout on bank-to-nationalsim calls so an unresponsive national registry never delays real-time payment auth loops beyond standard banking SLA."

  client_retry_backoff_seconds:
    value: 0.2
    label: assumption
    derived_from: policy
    reason: "Brief 200ms delay before at most one retry on connection glitch to avoid retry storming a degraded national system."

