# =====================================================================
# RESEARCH STATUS: which facts about the real world we have actually checked
# =====================================================================
#
# What this file is
#   The project plan makes claims about real banks, regulators and papers
#   (how a detection tool performs, what a procedure says, which licence a
#   dataset has). Some claims were checked at the source and some were not.
#   This table records, for each claim, how far it was checked, so nobody
#   builds on an unchecked claim by accident.
#
# Who reads it
#   core/level10_check.py counts the entries by status, by hand check and by
#   tool re-check, and showcase/level_10.py shows those counts.
#   tests/unit/test_research_status.py pins the file's shape and counts.
#
# How to read an entry
#   id        a short name for the claim.
#   claim     the claim itself.
#   status    how well it is backed:
#               confirmed   a source says it
#               changed     the source says something different from the
#                           first plan
#               reported    seen only in a second-hand or vendor source
#               unverified  not found in a source yet
#   hand_checked   true if the author opened the page and saw the text.
#   tool_rechecked a search tool re-read the page:
#               none      no tool re-check
#               single    one tool found it
#               both      two tools found it
#               disagree  the two tools disagreed
#               A tool re-check never sets hand_checked.
#   source_url  the page, or null where no address is recorded.
#   note        a short plain-English remark; it may be empty.
#
# Example
#   fca_37_percent_not_reported is confirmed, hand_checked true, and both
#   tools found it: the author saw the sentence on the FCA page.
#
# Checked by: tests/unit/test_research_status.py and the Level 10 showcase
# =====================================================================

findings:
  # ---- India's shared fraud systems: MuleHunter, I4C registry, DPIP ----
  # MuleHunter.AI is the mule-detection tool RBIH built. The I4C Suspect
  # Registry is a shared list of suspect identifiers and layer-1 mule
  # accounts. DPIP is the Digital Payments Intelligence Platform (RBIH
  # documentation). See docs/interfaces/national_systems.md.
  - id: mulehunter_rule_false_positives
    claim: "RBIH found rule-based mule detection gives high false positive rates."
    status: confirmed
    hand_checked: true
    tool_rechecked: disagree
    source_url: null
    note: "Author saw on the RBIH MuleHunter page: 'Traditional rule-based detection systems currently employed by banks result in high false positive rates and miss evolving fraud patterns.'"
  - id: mulehunter_slow_turnaround
    claim: "RBIH found rule-based mule detection is slow to turn around."
    status: unverified
    hand_checked: false
    tool_rechecked: none
    source_url: null
    note: "Not on the RBIH MuleHunter page. The page speaks of minimal false positives and near real-time detection, which is a different claim. Section 2's 'slow turnaround' is not supported."
  - id: mulehunter_bank_count
    claim: "Number of banks using MuleHunter.AI; counts conflict, dated timeline: 21 in Oct 2025, 23 in Dec 2025, 26 in Mar 2026, 31 in Sep 2026."
    status: changed
    hand_checked: false
    tool_rechecked: single
    source_url: null
    note: "Author saw an RBI speech sentence: 'MuleHunter.ai ... has been scaled up from about 5 banks at the beginning of this year to 21 banks.' The speech date (10 Oct 2025) comes from a tool, not the author. 26 banks (24 Mar 2026) was found by both tools; 31 banks (7 Sep 2026) by one tool only."
  - id: i4c_registry_figures
    claim: "I4C Suspect Registry holds lakhs of suspect identifiers and Layer 1 mule accounts (MHA Lok Sabha answers)."
    status: confirmed
    hand_checked: true
    tool_rechecked: both
    source_url: null
    note: "Author saw the Jan 2026 figures (23.05 lakh identifiers, 27.37 lakh Layer 1 mule accounts, registry launched 10.09.2024). The Jun 2026 figures (30.48 and 32.08 lakh) were found by both tools, not by the author."
  - id: i4c_registry_bank_count
    claim: "Number of banks on the I4C registry itself."
    status: unverified
    hand_checked: false
    tool_rechecked: none
    source_url: null
    note: ""
