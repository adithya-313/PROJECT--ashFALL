  # ---- Holds and freezes (the legal side; see config/legal_actions.yaml) ----
  # CFCFRMS is the system named in the Home Ministry procedure (the SOP),
  # where a bank updates a hold. A hold keeps an amount in place; a freeze
  # blocks the account.
  - id: cfcfrms_hold_process
    claim: "The beneficiary bank puts on hold an amount to the extent of the amount reported (MHA SOP, 2 Jan 2026)."
    status: confirmed
    hand_checked: true
