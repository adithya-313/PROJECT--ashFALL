[project]
dependencies = [
    "opentelemetry-exporter-otlp-proto-http>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0",
    "ruff>=0.4.4",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "needs_stack: test needs the Docker Compose stack (database, Kafka) running",
    "gpu: test needs a CUDA GPU with torch and Triton; CI leaves it out, run it with `make test-gpu`",
    "ml: test needs the requirements-ml.txt libraries (mlflow, xgboost and so on); the CI ml job runs it, the fast jobs leave it out",
    "needs_dvc: test needs files from `dvc pull` (model v1 files); local only, run it with `make test-dvc`",
]
